[package]
name = "scientify"
version = "0.3.0-alpha.2"
edition = "2021"
license = "Apache-2.0"
description = "Scientify local research workspace"

[lib]
name = "scientify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scientify-core = { path = "../crates/scientify-core" }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
notify = "8"
tauri-plugin-opener = "2"
rfd = "0.16"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKNavigation", "WKBackForwardListItem", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
