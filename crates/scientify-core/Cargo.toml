[package]
name = "scientify-core"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomicwrites = "0.4"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
