name: macOS translation checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled translation
        run: pnpm prepare:translation
      - run: pnpm build
      - run: node --test scripts/prepare-agent.test.mjs
      - run: pnpm exec vitest run src/features/translation
      - name: Host bridge checks (no desktop capture)
        run: cargo test -p scientify translation --lib --locked --features custom-protocol
      - run: dotnet test vendor/yita/tests/Yita.Native.Mac.Tests -c Release
      - run: dotnet test vendor/yita/tests/Yita.Desktop.Tests -c Release
      - name: Build the native application
        run: pnpm tauri build --bundles app
      - name: Archive local acceptance build
        run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Scientify.app Scientify-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Scientify-macOS-local-acceptance
          path: Scientify-macOS.zip
