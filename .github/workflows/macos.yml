name: macOS checks

on:
  push:
    branches: [main, 'codex/apple-silicon-release']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apple-silicon:
    name: Apple Silicon build and native verification
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SCIENTIFY_CODEX_TRIPLE: aarch64-apple-darwin
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify native ARM host and temporary paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/scientify-tests"
          echo "TMPDIR=$(cd "$RUNNER_TEMP/scientify-tests" && pwd -P)/" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify release tag
        if: inputs.release
        run: |
          git fetch origin main --tags
          node scripts/check-release.mjs '${{ inputs.tag }}'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm check
      - run: pnpm test --maxWorkers=2
      - run: node --test scripts/platform.test.mjs
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native verification app
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --ci -- --locked
      - name: Verify native browser, library and IPC
        run: python3 scripts/verify-macos.py --native target/debug/scientify
      - name: Configure optional Developer ID signing
        env:
          APPLE_CERTIFICATE: ${{ inputs.release && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.release && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          SCIENTIFY_SIGNING_IDENTITY: ${{ inputs.release && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ inputs.release && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ inputs.release && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ inputs.release && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: bash scripts/setup-macos-signing.sh
      - name: Build Apple Silicon DMG
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles app,dmg --ci -- --locked
      - name: Verify packaged application and DMG
        run: python3 scripts/verify-macos.py --bundle target/release/bundle
      - name: Stage release assets
        run: node scripts/stage-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scientify-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/scientify-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/scientify-signing.p12" "$RUNNER_TEMP/scientify-notary.p8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-verification
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
