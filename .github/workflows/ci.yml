name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled translation
        run: pnpm prepare:translation
      - name: Prepare assets and build frontend
        run: pnpm run build
      - name: Formatting
        run: pnpm format:check
      - name: Type checking
        run: pnpm check
      - name: Release platform mapping and development data
        run: node --test scripts/platform.test.mjs scripts/dev-data.test.mjs
      - name: Frontend tests
        run: pnpm test --maxWorkers=2
      - name: Install UI test browser
        run: pnpm exec playwright install chromium
      - name: Browser integration tests
        run: pnpm test:ui
        env:
          SCIENTIFY_BROWSER_CHANNEL: chromium
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/cargo-test.log"
          if ! CARGO_TERM_COLOR=never cargo test --workspace --locked -- --test-threads=1 2>&1 | tee "$log"; then
            # Job logs need admin rights; annotations are visible on the run page to everyone.
            escape() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }'; }
            summary=$(grep -E '^(error(\[E[0-9]+\])?: |test .+ \.\.\. FAILED$|thread .+ panicked at )' "$log" | head -40 || true)
            details=$(awk '/^---- .* stdout ----$/ { show = 1 } show { print } /^failures:$/ { if (show) exit }' "$log" | head -80 || true)
            echo "::error title=cargo test summary::$(printf '%s\n' "$summary" | escape)"
            if [ -n "$details" ]; then echo "::error title=cargo test failures::$(printf '%s\n' "$details" | escape)"; fi
            exit 1
          fi
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
