name: Windows checks

on:
  push:
    branches: [main, codex/literature-workspace-browser]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare assets and build frontend
        run: pnpm run build
      - name: Type checking
        run: pnpm check
      - name: Frontend tests
        run: pnpm test --maxWorkers=2
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
