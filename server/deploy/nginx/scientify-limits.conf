# /etc/nginx/conf.d/scientify-limits.conf (http context).
# Per-address limits in front of the API. The server keeps its own per-number
# cooldown and per-address cap on sign-in codes as well.
limit_req_zone $binary_remote_addr zone=scientify_codes:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=scientify_api:10m rate=30r/s;
