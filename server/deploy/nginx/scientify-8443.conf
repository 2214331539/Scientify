# /etc/nginx/conf.d/scientify.conf, for a host where another site already
# serves port 443 for the same address. The API gets its own port and reuses
# the certificate that site keeps for the address; its renewals reload Nginx,
# which picks up the new certificate here too. The cloud firewall must allow
# TCP 8443.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # The other site's certificate for this address (read only).
    ssl_certificate /etc/letsencrypt/live/<address>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<address>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Sync pushes may carry several notes; PDFs go straight to OSS instead.
    client_max_body_size 16m;

    location = /v1/auth/send-code {
        limit_req zone=scientify_codes burst=3 nodelay;
        include /etc/nginx/snippets/scientify-proxy.conf;
    }
    location ^~ /v1/ {
        limit_req zone=scientify_api burst=100 nodelay;
        include /etc/nginx/snippets/scientify-proxy.conf;
    }
    location / {
        return 404;
    }
}
