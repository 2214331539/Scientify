# /etc/nginx/sites-available/scientify, linked into sites-enabled.
# Works for a domain or a bare IP: the certificate comes from acme.sh (see
# DEPLOYMENT.md), which can issue short-lived Let's Encrypt IP certificates.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # Nginx 1.25.1 or newer; before that, add http2 to the listen lines.
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/scientify.crt;
    ssl_certificate_key /etc/nginx/tls/scientify.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Sync pushes may carry several notes; PDFs go straight to OSS instead.
    client_max_body_size 16m;

    location = /v1/auth/send-code {
        limit_req zone=scientify_codes burst=3 nodelay;
        include /etc/nginx/snippets/scientify-proxy.conf;
    }
    location ^~ /v1/ {
        limit_req zone=scientify_api burst=100 nodelay;
        include /etc/nginx/snippets/scientify-proxy.conf;
    }
    location / {
        return 404;
    }
}
