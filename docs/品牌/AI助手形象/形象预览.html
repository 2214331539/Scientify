.sf-mascot {
  flex: none;
  overflow: visible;
}
.sf-mascot-eyes {
  transform-box: fill-box;
  transform-origin: center;
  animation: sf-mascot-blink 5.2s ease-in-out infinite;
}
.sf-mascot-body {
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.sf-mascot.is-thinking .sf-mascot-eyes {
  animation:
    sf-mascot-glance 2.6s ease-in-out infinite,
    sf-mascot-blink 5.2s ease-in-out infinite;
}
.sf-mascot.is-working .sf-mascot-body {
  animation: sf-mascot-bob 1.1s ease-in-out infinite;
}
.sf-mascot.is-working .sf-mascot-eyes {
  animation: sf-mascot-scan 2.2s ease-in-out infinite;
}
.sf-mascot.is-working .sf-mascot-shadow {
  transform-box: fill-box;
  transform-origin: center;
  animation: sf-mascot-shadow 1.1s ease-in-out infinite;
}
@keyframes sf-mascot-blink {
  0%,
  92%,
  100% {
    transform: scaleY(1);
  }
  95% {
    transform: scaleY(0.12);
  }
}
@keyframes sf-mascot-glance {
  0%,

  60% {

}
@keyframes sf-mascot-scan {
  0%,

  50% {

}
@keyframes sf-mascot-bob {
  0%,
  100% {
    transform: translateY(0) scale(1, 1);
  }
  45% {
    transform: translateY(-6px) scale(0.98, 1.02);
  }
  90% {
    transform: translateY(0) scale(1.03, 0.97);
  }
}
@keyframes sf-mascot-shadow {
  0%,

    opacity: 1;
  }
  45% {
    transform: scaleX(0.82);
    opacity: 0.7;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sf-mascot *,
  .sf-mascot.is-working .sf-mascot-body {
    animation: none !important;
  }
}
