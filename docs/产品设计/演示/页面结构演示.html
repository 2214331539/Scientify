<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientify 页面结构与功能入口</title>
<style>
:root{--ink:#242727;--ink2:#555b5b;--muted:#6b7170;--line:#e5e7e6;--line2:#d1d6d4;--chrome:#f7f7f7;--sel:#eaeaea;--accent:#3d4643;--ok:#246b45;--warn:#865a16;--bad:#b03636;--info:#2e65a4;--pin:#e8590c;--font:"PingFang SC","Microsoft YaHei UI","Segoe UI",-apple-system,system-ui,sans-serif;--mono:"SF Mono","Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.65 var(--font);color:var(--ink);background:#fff;display:grid;grid-template-columns:270px minmax(0,1fr)}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
.nav{height:100vh;overflow:auto;border-right:1px solid var(--line);background:#fafafa;padding:18px 12px 24px}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 16px}
.brand img{width:30px;height:30px}
.brand b{display:block;font-size:15px;line-height:1.3}
.brand span{font-size:12px;color:var(--muted)}
.plat{display:grid;grid-template-columns:1fr 1fr;background:#ececec;border-radius:7px;padding:2px;margin:0 4px 10px}
.plat button{border:0;background:transparent;border-radius:5px;padding:5px 0;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer}
.plat button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 6px 6px;font-size:11.5px;color:var(--muted)}
#x-toc h4{margin:14px 8px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
#x-toc a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink);font-size:13px}
#x-toc a:hover{background:#efefef;text-decoration:none}
#x-toc a.on{background:#e4e6e5;font-weight:600}
.meta{margin:18px 8px 0;font-size:11.5px;color:var(--muted);line-height:1.6}
main{height:100vh;overflow:auto;padding:26px 36px 40px;min-width:0}
.ph .crumb{font-size:12px;color:var(--muted)}
.ph h1{margin:2px 0 6px;font-size:23px;line-height:1.3;display:flex;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:500;padding:0 7px;border-radius:9px;border:1px solid;white-space:nowrap;line-height:18px}
.tag.have{color:var(--ok);border-color:#b9d8c6;background:#f1f8f4}
.tag.adjust{color:var(--warn);border-color:#e6d2ad;background:#fbf6ec}
.tag.todo{color:var(--info);border-color:#bcd0ea;background:#f1f6fc}
.lead{margin:0 0 16px;color:var(--ink2);max-width:920px}
.stage{position:relative;margin:0 0 22px;overflow:hidden}
.stage .scr{transform-origin:0 0;width:max-content}
.notes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px;max-width:1300px}
.notes h3{font-size:14px;margin:0 0 6px}
.notes ol{list-style:none;margin:0 0 14px;padding:0}
.notes ol li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.notes ol li:first-child{border-top:0}
.notes ol strong{font-size:13.5px}
.notes ol p{margin:1px 0 0;font-size:13px;color:var(--ink2)}
.notes ul{margin:0 0 16px;padding-left:18px;font-size:13px;color:var(--ink2)}
.notes ul li{margin:3px 0}
.notes ul.goes{list-style:none;padding:0}
.goes li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.goes .i{color:var(--muted)}
.pager{display:flex;justify-content:space-between;margin-top:26px;max-width:1300px}
.pager button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pager button:disabled{visibility:hidden}
.pin{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--pin);color:#fff;font:600 11px/1 var(--font);flex:none;box-shadow:0 0 0 2px #fff;vertical-align:middle}
.doc{max-width:1120px}
.doc h2{font-size:17px;margin:24px 0 8px}
.doc p{margin:6px 0;color:var(--ink2)}
.doc table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 10px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:#f6f6f6;font-weight:600;white-space:nowrap}
.doc ul,.doc ol{padding-left:20px;color:var(--ink2);font-size:13.5px}
.doc li{margin:3px 0}
.sitemap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sitemap .g{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px}
.sitemap .g b{display:block;margin-bottom:4px}
.sitemap .g div{padding:2px 0;color:var(--ink2)}
.sitemap .g div.l2{padding-left:16px}
.sitemap .g div.l3{padding-left:32px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin:10px 0 6px}
.cmp figure{margin:0;min-width:0}
.cmp figure>div{overflow:hidden}
.cmp figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---------- mock screens ---------- */
.scr{position:relative;font-size:12.5px;line-height:1.5;color:var(--ink);user-select:none;cursor:default}
.scr.mac{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
.scr.win{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif}
.scr [data-go]{cursor:pointer}
.scr [data-go]:hover{outline:2px solid rgba(232,89,12,.45);outline-offset:1px}
.desk{position:relative;background:#e3e7ea;padding:20px;border-radius:12px}
.scr.mac .desk{padding-top:44px}
.mbar{position:absolute;left:0;right:0;top:0;height:26px;background:rgba(255,255,255,.82);border-bottom:1px solid #d3d6d8;display:flex;align-items:center;gap:15px;padding:0 14px;font-size:12.5px;border-radius:12px 12px 0 0;z-index:3}
.mbar b{font-weight:700}
.mbar .on{background:#2f6fe4;color:#fff;border-radius:4px;padding:0 6px;margin:0 -6px}
.mbar .r{margin-left:auto;display:flex;gap:14px;align-items:center;color:#333}
.mbar .si2{display:flex;align-items:center;padding:1px 5px;border-radius:4px}
.mbar .si2.on{background:rgba(0,0,0,.12);color:#111}
.win{position:relative;background:#fff;border-radius:8px;box-shadow:0 16px 44px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.09);overflow:hidden;display:flex;flex-direction:column}
.scr.mac .win{border-radius:11px}
.win.inactive{box-shadow:0 8px 24px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.08)}
.win.inactive .tl i{background:#d9d9d9!important}
.tb{display:flex;align-items:center;gap:6px;flex:none;border-bottom:1px solid var(--line);padding:0 8px;background:#fff;position:relative}
.scr.win .tb{height:40px}
.scr.mac .tb{height:50px;background:#f5f5f5;border-bottom-color:#dadada;padding-left:16px}
.tb .logo{width:18px;height:18px;margin:0 2px 0 4px}
.tl{display:flex;gap:8px;margin-right:10px;flex:none}
.tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.tl i:nth-child(2){background:#febc2e}
.tl i:nth-child(3){background:#28c840}
.wc{display:flex;align-self:stretch;margin:0 -8px 0 4px}
.wc i{width:46px;display:grid;place-items:center;color:#333}
.wc i.x{color:#333}
.ibtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--ink2);position:relative;flex:none}
.ibtn.on{background:var(--sel);color:var(--ink)}
.ibtn .badge{position:absolute;top:1px;right:0}
.badge{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:600;line-height:1}
.badge.gray{background:#8a9292}
.switcher{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.switcher small{font-weight:400;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:10.5px}
.search{flex:0 1 360px;margin:0 auto;display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line2);border-radius:7px;padding:0 9px;color:var(--muted);background:#fff}
.scr.mac .search{background:rgba(0,0,0,.055);border-color:transparent}
kbd{font:11px var(--font);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:#fff;white-space:nowrap}
.search kbd{margin-left:auto}
.sync{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:12px;padding:0 6px;white-space:nowrap}
.bd{display:flex;flex:1;min-height:0;position:relative}
.rail{width:48px;flex:none;border-right:1px solid var(--line);background:var(--chrome);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.scr.mac .rail{background:#ebebed}
.ri{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);position:relative}
.ri.on{background:#dfe2e1;color:var(--ink)}
.ri.on::before{content:"";position:absolute;left:-6px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.rail .sp,.side .sp{flex:1}
.side{width:236px;flex:none;border-right:1px solid var(--line);background:var(--chrome);overflow:hidden;display:flex;flex-direction:column}
.scr.mac .side{background:#efeff1}
.sh{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px 0 14px;font-weight:600;flex:none}
.sh .r{margin-left:auto;display:flex;gap:2px}
.sg{padding:2px 6px 6px}
.sg h6{margin:8px 8px 3px;font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center}
.sg h6 .r{margin-left:auto}
.si{display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;border-radius:5px;color:var(--ink);white-space:nowrap;overflow:hidden}
.si .c{margin-left:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:4px}
.si.on{background:var(--sel)}
.scr.mac .si.on{background:rgba(0,0,0,.085)}
.si.l2{padding-left:24px}
.si.l3{padding-left:40px}
.si .i{color:var(--ink2);flex:none}
.acct{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);flex:none}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:#d8e1dd;color:#2c3a35;font-size:11px;font-weight:600;flex:none}
.av.b{background:#dfe1ef;color:#2d3352}.av.c{background:#f0e1d6;color:#5a3a22}.av.d{background:#e6e6e6;color:#666}
.avs{display:flex}
.avs .av{width:20px;height:20px;font-size:10px;margin-left:-5px;box-shadow:0 0 0 2px #fff}
.avs .av:first-child{margin-left:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;position:relative}
.mh{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.scr.mac .mh.tall{height:50px}
.mh h2{font-size:14px;margin:0;font-weight:600;white-space:nowrap}
.mh .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.tabs{display:flex;height:34px;border-bottom:1px solid var(--line);background:var(--chrome);flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-right:1px solid var(--line);color:var(--ink2);max-width:250px;white-space:nowrap;overflow:hidden}
.tab.on{background:#fff;color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.tab .x{margin-left:4px;color:var(--muted)}
.vt{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);height:36px;align-items:stretch;flex:none}
.vt span{display:flex;align-items:center;gap:5px;padding:0 10px;color:var(--ink2);border-bottom:2px solid transparent}
.vt span.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.vt .r{margin-left:auto;display:flex;gap:6px;align-items:center;border:0}
.btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:5px;background:#fff;color:var(--ink);white-space:nowrap;font-size:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:22px;padding:0 8px;font-size:11.5px}
.scr.mac .btn{border-radius:6px}
.scr.mac .btn.pri{background:#2f7cf6;border-color:#2f7cf6}
.inp{display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line2);border-radius:5px;padding:0 8px;color:var(--muted);background:#fff;white-space:nowrap}
.inp.f{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:26px;flex:none}
.seg span{padding:0 10px;display:flex;align-items:center;gap:4px;border-left:1px solid var(--line2);color:var(--ink2);font-size:12px;white-space:nowrap}
.seg span:first-child{border-left:0}
.seg span.on{background:var(--sel);color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;background:#f0f1f1;color:var(--ink2);font-size:11px;white-space:nowrap}
.chip.ok{background:#eaf5ee;color:var(--ok)}
.chip.warn{background:#fbf3e4;color:var(--warn)}
.chip.bad{background:#fbecec;color:var(--bad)}
.chip.info{background:#ecf2fa;color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:#b9c0bf}
.dot.ok{background:var(--ok)}.dot.run{background:var(--info)}.dot.bad{background:var(--bad)}.dot.warn{background:#d39b2a}
table.t{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
table.t th{background:#fafafa;text-align:left;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
table.t td{padding:6px 10px;border-bottom:1px solid #f0f1f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.t tr.sel td{background:#edf1f0}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t .i{vertical-align:-2px}
.rp{width:320px;flex:none;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.rpt{display:flex;align-items:center;height:38px;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;flex:none}
.rpt span{padding:3px 9px;border-radius:5px;color:var(--ink2);white-space:nowrap}
.rpt span.on{background:var(--sel);color:var(--ink);font-weight:600}
.rpt .r{margin-left:auto}
.st{height:24px;flex:none;border-top:1px solid var(--line);background:var(--chrome);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.st .r{margin-left:auto;display:flex;gap:14px}
.st span{display:flex;align-items:center;gap:4px}
.sec{padding:12px 16px}
.sec h5{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.sec h5 .r{margin-left:auto;font-weight:400}
.li{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;min-width:0}
.li .m{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.li .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.li .sub{color:var(--muted);font-size:11.5px}
.li.on{background:var(--sel)}
.li .i{flex:none;color:var(--ink2)}
.col{display:flex;flex-direction:column;min-height:0}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:0;min-height:0}
.grid2>.sec+.sec{border-left:1px solid var(--line)}
.hr{border-top:1px solid var(--line)}
.scrim{position:absolute;inset:0;background:rgba(18,22,21,.26)}
.dialog{position:absolute;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.scr.mac .dialog.sheet{border-radius:0 0 11px 11px;box-shadow:0 18px 40px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.1)}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex:none}
.dlg-h .r{margin-left:auto}
.dlg-b{padding:14px 16px;flex:1;min-height:0}
.dlg-f{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex:none}
.dlg-f .l{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f1}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;color:var(--muted);font-size:11.5px}
.sw{width:30px;height:18px;border-radius:9px;background:#c8cecc;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:14px}
.scr.mac .sw.on{background:#2f7cf6}
.pop{position:absolute;background:#fff;border-radius:9px;box-shadow:0 12px 36px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.08);padding:5px;z-index:5}
.scr.mac .pop.menu{background:rgba(246,246,246,.98);border-radius:7px}
.menu .mi{display:flex;align-items:center;gap:8px;height:25px;padding:0 10px;border-radius:5px;white-space:nowrap}
.menu .mi kbd{border:0;background:transparent;margin-left:auto;padding-left:26px;font-size:11.5px}
.menu .mi .sub{margin-left:auto;color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .mi.on{background:var(--sel)}
.scr.mac .menu .mi.on{background:#2f6fe4;color:#fff}
.scr.mac .menu .mi.on kbd,.scr.mac .menu .mi.on .i{color:#fff}
.menu .mi.dis{color:#a3a9a8}
.menu .mi.dng{color:var(--bad)}
.cover-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;padding:18px 22px}
.cv{display:flex;flex-direction:column;gap:5px;position:relative}
.cv .bk{height:168px;border-radius:3px 8px 8px 3px;padding:14px 12px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 7px 0 0 rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.14);font-weight:600;font-size:13px;line-height:1.35;color:#273330}
.cv .bk small{font-weight:400;font-size:11px;opacity:.8;display:flex;align-items:center;gap:4px}
.cv .nm{font-size:12.5px;font-weight:600}
.cv .mt{font-size:11px;color:var(--muted);margin-top:-4px}
.pdfwrap{flex:1;background:#e9ebeb;overflow:hidden;display:flex;justify-content:center;padding:16px 0;position:relative;min-height:0}
.page{width:580px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);padding:34px 48px;font-family:"Times New Roman",Georgia,serif;color:#1f1f1f;overflow:hidden}
.page h3{font-size:15px;text-align:center;margin:0 0 4px;line-height:1.35}
.page .au{text-align:center;font-size:10.5px;color:#555;margin-bottom:12px}
.page h4{font-size:12px;margin:12px 0 4px}
.page p{font-size:11.2px;line-height:1.6;margin:5px 0;text-align:justify}
.ln{height:7px;background:#e2e4e4;border-radius:2px;margin:8px 0}
.mark{background:rgba(255,206,74,.55)}
.selx{background:rgba(46,110,228,.25)}
.ftb{position:absolute;display:flex;gap:1px;background:#262b2a;color:#fff;border-radius:8px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:12px;z-index:4}
.ftb span{padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.readbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:4px 10px;font-size:12px;white-space:nowrap}
.code{flex:1;font:12px/1.7 var(--mono);padding:6px 0;overflow:hidden;background:#fff;min-height:0}
.code .l{display:flex;white-space:pre}
.code .l.cur{background:#f4f6f5}
.code .n{width:42px;text-align:right;padding-right:14px;color:#a5abab;flex:none}
.kw{color:#8b2f8b}.str{color:#2b6a3d}.fn{color:#2457a6}.cm{color:#8a9090;font-style:italic}.num{color:#a14f12}
.panel{height:186px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column}
.term{flex:1;background:#fbfbfb;font:11.5px/1.65 var(--mono);padding:6px 12px;color:#333;overflow:hidden;white-space:pre}
.chat{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-height:0}
.msg.u{align-self:flex-end;background:#f0f1f1;border-radius:10px;padding:7px 10px;max-width:88%}
.steps{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink2)}
.steps div{display:flex;gap:6px;align-items:center;padding:2px 0}
.ans p{margin:0 0 6px;line-height:1.65}
.cite{font-size:11px;color:var(--info);background:#ecf2fa;border-radius:4px;padding:0 4px;white-space:nowrap}
.approve{border:1px solid #e6d2ad;background:#fffaf1;border-radius:8px;padding:8px 10px}
.diff{font:11.5px/1.6 var(--mono);background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 7px;margin:6px 0}
.diff .a{color:var(--ok)}
.composer{border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:none}
.cbox{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;color:var(--muted);min-height:52px}
.cbar{display:flex;align-items:center;gap:4px}
.cbar .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.ed{flex:1;padding:16px 30px;overflow:hidden;min-height:0}
.ed h1{font-size:19px;margin:0 0 6px;line-height:1.35}
.ed .meta{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ed p{margin:0 0 8px;font-size:13px;line-height:1.75}
.ed blockquote{margin:6px 0 10px;padding:4px 12px;border-left:3px solid #d6dad9;color:#444;font-size:12.5px;line-height:1.7}
.ed ul{margin:0 0 8px;padding-left:20px;font-size:13px;line-height:1.75}
.ed h3{font-size:14px;margin:12px 0 4px}
.fmt{display:flex;gap:1px;padding:3px 12px;border-bottom:1px solid var(--line);color:var(--ink2);flex:none;align-items:center}
.fmt .ibtn{width:26px;height:26px}
.fmt .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
.setnav{width:196px;border-right:1px solid var(--line);background:var(--chrome);padding:8px 6px;flex:none}
.mactabs{display:flex;justify-content:center;gap:1px;padding:4px 8px 6px;border-bottom:1px solid #d9d9d9;background:#f5f5f5;flex:none}
.mactabs span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;border-radius:6px;font-size:11px;color:#444;min-width:54px}
.mactabs span.on{background:rgba(0,0,0,.08);color:#111}
.mactitle{height:30px;display:flex;align-items:center;justify-content:center;position:relative;background:#f5f5f5;font-weight:600;font-size:12.5px;flex:none}
.mactitle .tl{position:absolute;left:12px}
.tp{position:absolute;width:380px;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.08);overflow:hidden;font-size:12.5px;z-index:4}
.scr.mac .tp{background:rgba(251,251,251,.97)}
.tp-h{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);color:var(--ink2)}
.tp-h .r{margin-left:auto;display:flex}
.tp-src{padding:8px 12px 2px;color:#6b7170;font-size:12px;line-height:1.55}
.tp-dst{padding:4px 12px 10px;font-size:13.5px;line-height:1.7}
.tp-a{display:flex;gap:2px;padding:3px 8px;border-top:1px solid var(--line);align-items:center}
.tp-in{margin:6px 10px 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;color:var(--muted)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;background:rgba(240,242,243,.97);border-top:1px solid #d5d8da;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 14px;font-size:11.5px;border-radius:0 0 12px 12px;color:#333}
.taskbar .tray{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:5px}
.taskbar .tray .on{background:rgba(0,0,0,.08);border-radius:4px;padding:2px}
.app3{position:absolute;background:#fff;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.scr.mac .app3{border-radius:11px}
.app3 .bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #e3e3e3;background:#f6f6f6;font-size:12px;color:#555}
.app3 .url{flex:1;height:24px;border-radius:6px;background:#fff;border:1px solid #e0e0e0;display:flex;align-items:center;padding:0 10px}
.app3 .pg{padding:18px 26px;font-family:Georgia,"Times New Roman",serif}
.app3 .pg h3{font-size:17px;margin:0 0 6px;line-height:1.35}
.app3 .pg p{font-size:12.5px;line-height:1.7;margin:6px 0;color:#222}
.callout-box{border:1px dashed #c9cfcd;border-radius:6px;padding:10px;color:var(--muted);font-size:12px;text-align:center}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mile{display:flex;gap:0;margin-top:4px}
.mile div{flex:1;padding:6px 8px;border-top:3px solid #d5dad8;font-size:12px}
.mile div.done{border-top-color:var(--ok)}
.mile div.now{border-top-color:var(--info)}
.mile small{display:block;color:var(--muted);font-size:11px}
.tl2 div{display:flex;gap:10px;padding:4px 0;font-size:12px}
.tl2 time{color:var(--muted);width:64px;flex:none}
.cmpbox{display:grid;grid-template-columns:150px 1fr 1fr;font-size:12px;border-top:1px solid var(--line)}
.cmpbox div{padding:5px 12px;border-bottom:1px solid #f0f1f1}
.cmpbox .h{font-weight:600;background:#fafafa}
.cmpbox .k{color:var(--muted)}
</style>
</head>

/* ---------- rendering ---------- */
const STATUS = { have: ['have', '已有'], adjust: ['adjust', '需调整'], todo: ['todo', '待做'] };
function renderToc(current) {
  let html = '';
  let group = '';
  for (const p of PAGES) {
    if (p.group !== group) { group = p.group; html += '<h4>' + group + '</h4>'; }
    const st = p.status ? '<span class="tag ' + STATUS[p.status][0] + '">' + STATUS[p.status][1] + '</span>' : '';
    html += '<a href="#' + p.id + '" class="' + (p.id === current ? 'on' : '') + '"><span>' + p.title + '</span>' + st + '</a>';
  }
  $('#x-toc').innerHTML = html;
}
function renderNotes(p) {
  const v = (x) => (typeof x === 'function' ? x() : x) || [];
  const regions = v(p.regions).map(([n, t, d]) => '<li><b class="pin">' + n + '</b><div><strong>' + t + '</strong><p>' + d + '</p></div></li>').join('');
  const goes = v(p.goes).map(([from, to, id]) => '<li><span>' + from + '</span>' + I('arrow-right', 12) + '<a href="#' + id + '">' + to + '</a></li>').join('');
  const list = (arr) => v(arr).map((s) => '<li>' + s + '</li>').join('');
  return '<div class="notes"><div><h3>区域与入口</h3><ol>' + regions + '</ol>' + (p.extra ? p.extra() : '') + '</div><div>' +
    (goes ? '<h3>从这里去</h3><ul class="goes">' + goes + '</ul>' : '') +
    (v(p.states).length ? '<h3>状态</h3><ul>' + list(p.states) + '</ul>' : '') +
    (v(p.changes).length ? '<h3>和现在相比</h3><ul>' + list(p.changes) + '</ul>' : '') + '</div></div>';
}
function fit() {
  const stage = $('#x-stage');
  const s = stage.querySelector(':scope > .scr');
  if (!s) { stage.style.height = ''; return; }
  s.style.transform = 'none';
  const w = s.offsetWidth;
  const h = s.offsetHeight;
  const scale = Math.min(1, stage.clientWidth / w);
  s.style.transform = 'scale(' + scale + ')';
  stage.style.height = Math.ceil(h * scale) + 'px';
}
function fitMinis() {
  document.querySelectorAll('.mini-box').forEach((box) => {
    const s = box.querySelector('.scr');
    if (!s) return;
    s.style.transformOrigin = '0 0';
    s.style.transform = 'none';
    const scale = Math.min(1, box.clientWidth / s.offsetWidth);
    s.style.transform = 'scale(' + scale + ')';
    box.style.height = Math.ceil(s.offsetHeight * scale) + 'px';
  });
}
function show() {
  const id = location.hash.slice(1) || PAGES[0].id;
  const index = Math.max(0, PAGES.findIndex((p) => p.id === id));
  const p = PAGES[index];
  document.querySelectorAll('.plat button').forEach((b) => b.classList.toggle('on', b.dataset.plat === plat));
  renderToc(p.id);
  $('#x-crumb').textContent = p.crumb || '';
  const st = p.status ? ' <span class="tag ' + STATUS[p.status][0] + '">' + STATUS[p.status][1] + '</span>' : '';
  $('#x-title').innerHTML = p.title + st;
  $('#x-lead').innerHTML = p.lead || '';
  if (p.doc) {
    $('#x-stage').innerHTML = p.doc();
    $('#x-notes').innerHTML = '';
  } else {
    $('#x-stage').innerHTML = p.render();
    $('#x-notes').innerHTML = renderNotes(p);
  }
  const prev = PAGES[index - 1];
  const next = PAGES[index + 1];
  $('#x-prev').disabled = !prev;
  $('#x-next').disabled = !next;
  $('#x-prev').textContent = prev ? '← ' + prev.title : '';
  $('#x-next').textContent = next ? next.title + ' →' : '';
  $('#x-prev').onclick = () => prev && (location.hash = prev.id);
  $('#x-next').onclick = () => next && (location.hash = next.id);
  requestAnimationFrame(() => { fit(); fitMinis(); });
  $('#x-main').scrollTop = 0;
}
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go && go.closest('.scr')) { e.preventDefault(); location.hash = go.dataset.go; }
  const pb = e.target.closest('.plat button');
  if (pb) { plat = pb.dataset.plat; localStorage.setItem('scientify-demo-platform', plat); show(); }
});
window.addEventListener('hashchange', show);
window.addEventListener('resize', () => { fit(); fitMinis(); });
show();
</script>
