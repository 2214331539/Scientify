<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientify · 管理后台原型</title>
<style>
/* Scientify admin prototype. Same graphite palette as the desktop app. */
:root,
[data-theme='light'] {
  --page: #f6f6f7;
  --canvas: #ffffff;
  --sunken: #fafafa;
  --hover: rgba(24, 24, 27, 0.045);
  --selected: rgba(24, 24, 27, 0.075);
  --line: rgba(24, 24, 27, 0.08);
  --line-strong: rgba(24, 24, 27, 0.15);
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #71717a;
  --text-4: #a1a1aa;
  --accent: #18181b;
  --on-accent: #ffffff;
  --link: #2f5bd3;
  --ok: #2f7d4f;
  --warn: #a5650e;
  --bad: #c0392b;
  --ok-bg: rgba(47, 125, 79, 0.1);
  --warn-bg: rgba(165, 101, 14, 0.1);
  --bad-bg: rgba(192, 57, 43, 0.09);
  --info-bg: rgba(47, 91, 211, 0.08);
  --shadow-pop: 0 0 0 1px rgba(0, 0, 0, 0.07), 0 12px 36px rgba(0, 0, 0, 0.14);
  --grid: #ececee;
  --axis: #c9c9ce;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --seq0: #f1f5fb;
  --seq1: #cde2fb;
  --seq2: #9ec5f4;
  --seq3: #5598e7;
  --seq4: #256abf;
  --seq5: #104281;
  color-scheme: light;
}
[data-theme='night'] {
  --page: #0e0e10;
  --canvas: #151517;
  --sunken: #121214;
  --hover: rgba(255, 255, 255, 0.05);
  --selected: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededef;
  --text-2: #a3a3ab;
  --text-3: #85858e;
  --text-4: #5b5b63;
  --accent: #ededef;
  --on-accent: #111113;
  --link: #8aa4ff;
  --ok: #4fae73;
  --warn: #d49a3a;
  --bad: #e66767;
  --ok-bg: rgba(79, 174, 115, 0.14);
  --warn-bg: rgba(212, 154, 58, 0.14);
  --bad-bg: rgba(230, 103, 103, 0.14);
  --info-bg: rgba(138, 164, 255, 0.12);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 36px rgba(0, 0, 0, 0.5);
  --grid: #26262a;
  --axis: #3a3a3f;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --seq0: #1b1f27;
  --seq1: #184f95;
  --seq2: #1c5cab;
  --seq3: #2a78d6;
  --seq4: #5598e7;
  --seq5: #9ec5f4;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
svg.i {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.num,
td.n,
th.n {
  font-variant-numeric: tabular-nums;
}

/* ---------- Shell ---------- */
.shell {
  display: grid;
  grid-template-columns: 224px 1fr;
  height: 100vh;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 10px;
  background: var(--canvas);
  border-right: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 8px 16px;
  font-weight: 600;
  font-size: 14px;
}
.brand .logo {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--accent);
  color: var(--on-accent);
}
.brand small {
  display: block;
  font-weight: 400;
  font-size: 11px;
  color: var(--text-3);
}
.nav-group {
  padding: 12px 10px 4px;
  font-size: 11px;
  color: var(--text-4);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--text-2);
  text-align: left;
}
.nav-item:hover {
  background: var(--hover);
  color: var(--text);
}
.nav-item.on {
  background: var(--selected);
  color: var(--text);
  font-weight: 550;
}
.nav-item .tag {
  margin-left: auto;
}
.side-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 6px 0;
  border-top: 1px solid var(--line);
}
.me {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  line-height: 1.35;
}
.me b {
  display: block;
  font-weight: 550;
}
.me span {
  color: var(--text-3);
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--text-3);
}
.icon-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: var(--canvas);
}
.top h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}
.crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-3);
}
.crumb button {
  border: 0;
  background: none;
  padding: 0;
  color: var(--text-3);
}
.crumb button:hover {
  color: var(--text);
}
.top .spacer {
  flex: 1;
}
.content {
  flex: 1;
  overflow: auto;
  padding: 22px 28px 48px;
}
.content > * + * {
  margin-top: 16px;
}

/* ---------- Controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--canvas);
  color: var(--text);
  white-space: nowrap;
}
.btn:hover {
  background: var(--hover);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.btn.primary:hover {
  opacity: 0.9;
}
.btn.danger {
  color: var(--bad);
}
.btn.ghost {
  border-color: transparent;
  background: none;
}
.btn.sm {
  height: 26px;
  padding: 0 9px;
  font-size: 12px;
}
.btn[disabled] {
  opacity: 0.45;
  cursor: default;
}
.seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 8px;
  background: var(--hover);
}
.seg button {
  height: 26px;
  padding: 0 11px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text-2);
}
.seg button.on {
  background: var(--canvas);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.06);
}
.field {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--canvas);
  color: var(--text-3);
}
.field input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: none;
  color: var(--text);
}
input.text,
select.text,
textarea.text {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--canvas);
  outline: 0;
}
textarea.text {
  height: 64px;
  padding: 7px 10px;
  resize: none;
}
input.text:focus,
select.text:focus,
textarea.text:focus,
.field:focus-within {
  border-color: var(--link);
  box-shadow: 0 0 0 3px var(--info-bg);
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar .grow {
  flex: 1;
}
.toggle {
  position: relative;
  width: 30px;
  height: 18px;
  border: 0;
  border-radius: 9px;
  background: var(--line-strong);
}
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.15s;
}
.toggle.on {
  background: var(--ok);
}
.toggle.on::after {
  left: 14px;
}

/* ---------- Cards, tiles ---------- */
.card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--canvas);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 0;
}
.card-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}
.card-head .sub {
  color: var(--text-3);
  font-size: 12px;
}
.card-head .spacer {
  flex: 1;
}
.card-body {
  padding: 12px 16px 16px;
}
.grid {
  display: grid;
  gap: 16px;
}
.g2 {
  grid-template-columns: 1fr 1fr;
}
.g3 {
  grid-template-columns: repeat(3, 1fr);
}
.g-main {
  grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
}
.tiles {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
}
.tile {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--canvas);
  text-align: left;
}
button.tile:hover {
  border-color: var(--line-strong);
}
.tile .k {
  color: var(--text-3);
  font-size: 12px;
}
.tile .v {
  margin-top: 4px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.tile .d {
  margin-top: 2px;
  color: var(--text-3);
  font-size: 12px;
}
.up {
  color: var(--ok);
}
.down {
  color: var(--bad);
}

/* ---------- Tables ---------- */
.table-wrap {
  overflow: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th,
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}
th {
  position: sticky;
  top: 0;
  background: var(--canvas);
  color: var(--text-3);
  font-weight: 500;
  font-size: 12px;
}
th.n,
td.n {
  text-align: right;
}
tbody tr:last-child td {
  border-bottom: 0;
}
tr.click {
  cursor: pointer;
}
tr.click:hover td {
  background: var(--hover);
}
td .muted,
.muted {
  color: var(--text-3);
}
.who b {
  font-weight: 550;
}
.who .muted {
  margin-left: 6px;
}
.wrap {
  white-space: normal;
}

/* ---------- Chips, meters ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  background: var(--hover);
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 500;
}
.chip.pro {
  background: var(--info-bg);
  color: var(--link);
}
.chip.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.chip.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.chip.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.chip svg.i {
  width: 12px;
  height: 12px;
}
.tag {
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  color: var(--text-3);
  font-size: 11px;
  line-height: 18px;
  font-weight: 400;
}
.meter {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 150px;
}
.meter .bar {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--hover);
  overflow: hidden;
}
.meter .bar i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--text-2);
}
.meter .bar i.hi {
  background: var(--warn);
}
.meter .bar i.full {
  background: var(--bad);
}
.meter span {
  min-width: 92px;
  color: var(--text-3);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.big-meter .bar {
  height: 8px;
  border-radius: 4px;
  background: var(--hover);
  overflow: hidden;
  display: flex;
  gap: 2px;
}
.big-meter .bar i {
  display: block;
  height: 100%;
}

/* ---------- Alerts ---------- */
.alerts {
  display: flex;
  flex-direction: column;
}
.alert {
  display: flex;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.alert:last-child {
  border-bottom: 0;
}
.alert svg.i {
  margin-top: 2px;
}
.alert.warn svg.i {
  color: var(--warn);
}
.alert.bad svg.i {
  color: var(--bad);
}
.alert.info svg.i {
  color: var(--link);
}
.alert .t {
  font-weight: 500;
}
.alert .s {
  color: var(--text-3);
  font-size: 12px;
}
.alert .btn {
  margin-left: auto;
  align-self: center;
}

/* ---------- Charts ---------- */
.chart {
  position: relative;
}
.chart svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.chart .gridline {
  stroke: var(--grid);
  stroke-width: 1;
}
.chart .baseline {
  stroke: var(--axis);
  stroke-width: 1;
}
.chart text {
  fill: var(--text-3);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.chart .label {
  fill: var(--text-2);
}
.chart .hit {
  fill: transparent;
}
.chart .cross {
  stroke: var(--text-4);
  stroke-width: 1;
  stroke-dasharray: 3 3;
  pointer-events: none;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-bottom: 10px;
  color: var(--text-2);
  font-size: 12px;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.legend i.line {
  height: 2px;
  border-radius: 1px;
}
.tip {
  position: fixed;
  z-index: 50;
  min-width: 140px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--canvas);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
  pointer-events: none;
}
.tip .h {
  margin-bottom: 4px;
  font-weight: 600;
}
.tip .r {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text-2);
}
.tip .r i {
  width: 8px;
  height: 8px;
  border-radius: 2px;
}
.tip .r b {
  margin-left: auto;
  padding-left: 14px;
  color: var(--text);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

/* ---------- Graph ---------- */
.graph-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px;
}
.graph svg {
  display: block;
  width: 100%;
  height: 590px;
}
.graph .edge {
  stroke: var(--line-strong);
}
.graph .edge.hl {
  stroke: var(--text-3);
}
.graph .node {
  cursor: pointer;
  stroke: var(--canvas);
  stroke-width: 2;
}
.graph .node.free {
  fill: var(--text-4);
}
.graph .node.pro {
  fill: var(--s1);
}
.graph .node.owner {
  stroke: var(--text);
  stroke-width: 2;
}
.graph .dim {
  opacity: 0.25;
}
.graph .hull {
  fill: var(--hover);
  stroke: var(--line);
  cursor: pointer;
}
.graph .hull.hl {
  fill: var(--selected);
  stroke: var(--line-strong);
}
.graph text.cl {
  fill: var(--text);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.graph text.cl tspan {
  fill: var(--text-3);
  font-weight: 400;
}
.graph text.nm {
  fill: var(--text-2);
  font-size: 11px;
  pointer-events: none;
}
.team-list .team {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
}
.team-list .team:hover,
.team-list .team.hl {
  background: var(--hover);
}
.team-list .team b {
  font-weight: 550;
}
.team-list .team .muted {
  font-size: 12px;
}

/* ---------- Matrix and heatmap ---------- */
.matrix td,
.matrix th {
  text-align: center;
}
.matrix td:first-child,
.matrix th:first-child {
  text-align: left;
}
.role {
  display: inline-block;
  min-width: 46px;
  padding: 1px 6px;
  border-radius: 5px;
  font-size: 11.5px;
}
.role.owner {
  background: var(--accent);
  color: var(--on-accent);
}
.role.editor {
  background: var(--info-bg);
  color: var(--link);
}
.role.reviewer {
  background: var(--warn-bg);
  color: var(--warn);
}
.role.viewer {
  background: var(--hover);
  color: var(--text-2);
}
.heat {
  display: grid;
  gap: 2px;
  align-items: center;
}
.heat .lbl {
  padding-right: 8px;
  color: var(--text-2);
  font-size: 12px;
  white-space: nowrap;
}
.heat .cell {
  height: 16px;
  border-radius: 3px;
}
.heat .axis {
  color: var(--text-4);
  font-size: 11px;
}
.ramp {
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 11px;
}
.ramp i {
  width: 14px;
  height: 10px;
  border-radius: 2px;
}

/* ---------- Detail pages ---------- */
.profile {
  display: flex;
  align-items: center;
  gap: 14px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--selected);
  font-weight: 600;
}
.avatar.sm {
  width: 24px;
  height: 24px;
  font-size: 11px;
}
.profile h2 {
  margin: 0;
  font-size: 18px;
}
.profile .muted {
  display: flex;
  align-items: center;
  gap: 8px;
}
.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--link);
}
.tabs {
  display: flex;
  gap: 18px;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  padding: 8px 0 10px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--text-3);
}
.tabs button.on {
  border-color: var(--text);
  color: var(--text);
  font-weight: 550;
}
.kv {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px 12px;
}
.kv dt {
  color: var(--text-3);
}
.kv dd {
  margin: 0;
}
.note {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 9px;
  background: var(--info-bg);
  color: var(--text-2);
}
.note svg.i {
  margin-top: 2px;
  color: var(--link);
}
.note.warn {
  background: var(--warn-bg);
}
.note.warn svg.i {
  color: var(--warn);
}
.badge-phase {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 11px;
  background: var(--hover);
  color: var(--text-3);
  font-size: 12px;
}
.rules {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.rule {
  padding: 12px 14px;
  border-radius: 9px;
  background: var(--sunken);
  border: 1px solid var(--line);
}
.rule .k {
  color: var(--text-3);

  function niceScale(max, count = 4) {
    const raw = Math.max(max, 1) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    const top = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
    return { top, ticks };
  }
  const short = (v) => (v >= 10000 ? (v / 10000).toFixed(v % 10000 ? 1 : 0) + ' 万' : fmt(v));

      out += `<line class="${t === 0 ? 'baseline' : 'gridline'}" x1="${m.l}" x2="${w - m.r}" y1="${y}" y2="${y}"/>`;
      out += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${fmtY(t)}</text>`;
    }
    return out;
  }
  const topRounded = (x, y, w, h, r) => {
    if (h <= 0) return '';
    r = Math.min(r, h, w / 2);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };
  const rightRounded = (x, y, w, h, r) => {
    if (w <= 0) return '';
    r = Math.min(r, w, h / 2);
    return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  };

  function lineChart({ labels, series, height = 220, fmtY = short, unit = '' }) {
    return (w) => {

      const max = Math.max(...series.flatMap((s) => s.data));
      const scale = niceScale(max);
      const iw = w - m.l - m.r;
      const x = (i) => m.l + (iw * i) / (labels.length - 1);
      const y = (v) => m.t + (height - m.t - m.b) * (1 - v / scale.top);
      let svg = axes(w, height, m, scale, fmtY);
      labels.forEach((l, i) => {
        if (i % 5 === 4 || i === 0) svg += `<text x="${x(i)}" y="${height - 8}" text-anchor="middle">${l}</text>`;
      });
      for (const s of series) {
        svg += `<path d="${s.data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
      }
      svg += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${height - m.b}" style="display:none"/>`;
      const band = iw / (labels.length - 1);
      labels.forEach((l, i) => {
        const id = tip(`<div class="h">${l}</div>${series.map((s) => tipRow(s.color, s.name, fmt(s.data[i]) + unit)).join('')}`);
        svg += `<rect class="hit" data-tip="${id}" data-cx="${x(i)}" x="${x(i) - band / 2}" y="${m.t}" width="${band}" height="${height - m.t - m.b}"/>`;
      });
      return `<svg viewBox="0 0 ${w} ${height}" height="${height}">${svg}</svg>`;
    };
  }

  function stackChart({ labels, rows, series, height = 220, unit = ' 点' }) {
    return (w) => {
      const m = { l: 46, r: 8, t: 10, b: 26 };
      const totals = rows.map((r) => series.reduce((s, k) => s + r[k.key], 0));
      const scale = niceScale(Math.max(...totals));
      const iw = w - m.l - m.r;
      const band = iw / labels.length;
      const bw = Math.max(4, Math.min(22, band * 0.62));
      const ih = height - m.t - m.b;
      let svg = axes(w, height, m, scale, short);
      rows.forEach((r, i) => {
        const cx = m.l + band * i + band / 2;
        let base = height - m.b;
        const visible = series.filter((s) => r[s.key] > 0);
        visible.forEach((s, j) => {
          const h = (ih * r[s.key]) / scale.top;
          const gap = j ? 2 : 0;
          const top = j === visible.length - 1;
          const y0 = base - h;
          if (top) svg += `<path d="${topRounded(cx - bw / 2, y0, bw, h - gap, 4)}" fill="${s.color}"/>`;
          else svg += `<rect x="${cx - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(0, h - gap)}" fill="${s.color}"/>`;
          base = y0;
        });
        if (i % 5 === 4 || i === 0) svg += `<text x="${cx}" y="${height - 8}" text-anchor="middle">${labels[i]}</text>`;
        const id = tip(`<div class="h">${labels[i]}</div>${series.map((s) => tipRow(s.color, s.name, fmt(r[s.key]) + unit)).join('')}${tipRow('', '合计', fmt(totals[i]) + unit)}`);
        svg += `<rect class="hit" data-tip="${id}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}"/>`;

      return `<svg viewBox="0 0 ${w} ${height}" height="${height}">${svg}</svg>`;
    };
  }

  // ---------- Teams ----------
  let layoutCache = null;
  function graphLayout() {
    if (layoutCache) return layoutCache;
    // Each team is a ring: the owner in the middle, the members around.
    const nodes = [];
    const index = new Map();
    for (const t of TEAMS) {
      const others = t.members.filter((m) => m !== t.owner);
      const ring = 46 + others.length * 7;
      for (const m of t.members) {
        const k = others.indexOf(m);
        const angle = -Math.PI / 2 + (2 * Math.PI * k) / others.length;
        index.set(m, nodes.length);
        nodes.push({
          id: m,
          team: t.id,
          x: k < 0 ? t.center[0] : t.center[0] + ring * Math.cos(angle),
          y: k < 0 ? t.center[1] : t.center[1] + ring * Math.sin(angle),
          r: 6 + Math.sqrt(USERS[m].used) / 5.5,
        });
      }
    }
    const weights = new Map();
    for (const t of TEAMS)
      for (const p of t.projects) {
        const ids = Object.keys(p.roles).map(Number);
        for (let a = 0; a < ids.length; a++)
          for (let b = a + 1; b < ids.length; b++) {
            const k = Math.min(ids[a], ids[b]) + '-' + Math.max(ids[a], ids[b]);
            weights.set(k, (weights.get(k) ?? 0) + 1);
          }
      }
    const edges = [...weights].map(([k, w]) => {
      const [a, b] = k.split('-').map(Number);
      return { a: index.get(a), b: index.get(b), w };
    });
    layoutCache = { nodes, edges };
    return layoutCache;
  }
  function teamGraph() {
    return () => {
      const { nodes, edges } = graphLayout();
      let svg = '';
      for (const t of TEAMS.map(teamOf)) {
        const own = nodes.filter((n) => n.team === t.id);
        const cx = own.reduce((s, n) => s + n.x, 0) / own.length;
        const cy = own.reduce((s, n) => s + n.y, 0) / own.length;
        const r = Math.max(...own.map((n) => Math.hypot(n.x - cx, n.y - cy) + n.r)) + 26;
        const hl = S.hl === t.id ? 'hl' : '';
        svg += `<circle class="hull ${hl}" data-act="team" data-id="${t.id}" data-hover-team="${t.id}" cx="${cx}" cy="${cy}" r="${r}"/>`;
        svg += `<text class="cl" data-act="team" data-id="${t.id}" x="${cx}" y="${cy - r - 8}" text-anchor="middle">${esc(t.name)}<tspan> · ${t.members.length} 人 · ${fmt(t.points)} 点</tspan></text>`;
      }
      for (const e of edges) {
        const a = nodes[e.a];
        const b = nodes[e.b];
        svg += `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${0.8 + e.w * 1.1}"/>`;
      }
      for (const n of nodes) {
        const u = USERS[n.id];
        const t = TEAMS.find((x) => x.id === n.team);
        const isOwner = t.owner === n.id;
        const projects = t.projects.filter((p) => p.roles[n.id]).map((p) => p.name);
        const id = tip(`<div class="h">${esc(u.name)}${isOwner ? ' · 团队所有者' : ''}</div>${tipRow('', '套餐', PLAN_NAME[u.plan])}${tipRow('', '本月用量', fmt(u.used) + ' 点')}${tipRow('', '团队项目', projects.length + ' 个')}`);
        svg += `<circle class="node ${u.plan} ${isOwner ? 'owner' : ''}" data-tip="${id}" data-act="user" data-id="${n.id}" cx="${n.x}" cy="${n.y}" r="${n.r}"/>`;
        svg += `<text class="nm" x="${n.x}" y="${n.y + n.r + 12}" text-anchor="middle">${esc(u.name)}</text>`;
      }
      return `<div class="graph"><svg viewBox="0 0 780 590" preserveAspectRatio="xMidYMid meet">${svg}</svg></div>`;
    };
  }

        ${card('团队', `<div class="team-list">${list.map((t) => `<button class="team ${S.hl === t.id ? 'hl' : ''}" data-act="team" data-id="${t.id}" data-hover-team="${t.id}"><b>${esc(t.name)}</b> ${planChip(USERS[t.owner])}<div class="muted">${t.members.length} 人 · ${t.projects.length} 个团队项目 · ${gb(t.gb)}</div><div class="muted">本月 ${fmt(t.points)} 点 · 最近活跃 ${USERS[t.owner].active}</div></button>`).join('')}</div>`, { pad: false })}
      </div>`
    );
  }
  function teamDetail() {
    const t = teamOf(TEAMS.find((x) => x.id === S.team));
    const owner = USERS[t.owner];
    const ownedGb = t.projects.filter((p) => p.roles[t.owner] === 'owner').reduce((s, p) => s + p.gb, 0);
    const heatRows = t.members.map((m) => {
      const roles = t.projects.map((p) => p.roles[m]).filter(Boolean);
      const intensity = roles.includes('owner') ? 1 : roles.includes('editor') ? 0.8 : 0.3;
      return DAYS.map((d) => (rand() < (weekend(d) ? 0.45 : 0.15) ? 0 : Math.round(intensity * (2 + rand() * 22))));
    });
    const all = heatRows.flat().filter((v) => v > 0).sort((a, b) => a - b);
    const q = (p) => all[Math.floor(p * (all.length - 1))] ?? 1;
    const steps = [q(0.2), q(0.4), q(0.6), q(0.8)];
    const level = (v) => (v === 0 ? 0 : 1 + steps.filter((s) => v > s).length);
    const heat = `<div class="heat" style="grid-template-columns:auto repeat(30,1fr)">
      ${t.members.map((m, i) => `<div class="lbl">${esc(USERS[m].name)}</div>${heatRows[i].map((v, j) => `<div class="cell" style="background:var(--seq${level(v)})" data-tip="${tip(`<div class="h">${esc(USERS[m].name)} · ${md(DAYS[j])}</div>${tipRow('', '同步推送', v + ' 次')}`)}"></div>`).join('')}`).join('')}
      <div></div>${DAYS.map((d, j) => `<div class="axis">${j % 5 === 4 || j === 0 ? md(d) : ''}</div>`).join('')}
    </div>
    <div class="ramp" style="margin-top:10px">少 ${[0, 1, 2, 3, 4, 5].map((k) => `<i style="background:var(--seq${k})"></i>`).join('')} 多<span class="muted" style="margin-left:12px">每格是一个人一天同步推送的次数</span></div>`;
    const STORE = [
      { key: 'lit', name: '文献', color: 'var(--s1)' },
      { key: 'code', name: '代码', color: 'var(--s2)' },
      { key: 'doc', name: '文档', color: 'var(--s3)' },
      { key: 'note', name: '笔记', color: 'var(--s4)' },
      { key: 'other', name: '其他', color: 'var(--s5)' },
    ];
    const storage = t.projects.map((p) => {
      const lit = 0.3 + rand() * 0.3;
      const code = 0.15 + rand() * 0.35;
      const doc = 0.03 + rand() * 0.04;
      const note = 0.02 + rand() * 0.03;
      const sum = lit + code + doc + note;
      const other = Math.max(0.04, 1 - sum);
      const k = p.gb / (sum + other);
      return { label: p.name, lit: lit * k, code: code * k, doc: doc * k, note: note * k, other: other * k };
    });
    const matrix = `<table class="matrix"><thead><tr><th>成员</th>${t.projects.map((p) => `<th>${esc(p.name)}</th>`).join('')}<th class="n">本月用量</th></tr></thead><tbody>${t.members
      .map((m) => `<tr><td><b>${esc(USERS[m].name)}</b> ${planChip(USERS[m])}</td>${t.projects.map((p) => `<td>${p.roles[m] ? `<span class="role ${p.roles[m]}">${ROLE[p.roles[m]]}</span>` : '<span class="muted">—</span>'}</td>`).join('')}<td class="n">${fmt(USERS[m].used)} 点</td></tr>`)
      .join('')}</tbody></table>`;
    const upsell = owner.plan === 'free' ? `<div class="note warn">${icon('alert')}<span>所有者是免费版，“${esc(t.projects[0].name)}”已有 ${Object.keys(t.projects[0].roles).length} 人，到了免费版每个项目 5 人的上限，再邀请会提示升级。这个团队适合介绍课题组版。</span></div>` : '';
    return `
      <div class="profile"><div class="avatar">${icon('team')}</div><div><h2>${esc(t.name)}</h2><div class="muted">所有者 ${esc(owner.name)}（${owner.phone}）· ${PLAN_NAME[owner.plan]}</div></div></div>
      <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
        ${tile('成员', t.members.length + ' 人', t.invites.length ? `另有 ${t.invites.length} 个邀请未接受` : '没有待接受的邀请')}
        ${tile('团队项目', t.projects.length, '有其他成员的项目')}
        ${tile('空间', gb(t.gb), `所有者占 ${gb(ownedGb)} / ${owner.plan === 'pro' ? '50 GB' : '2 GB'}`)}
        ${tile('本月 AI 用量', fmt(t.points) + ' 点', '成员各自扣自己的额度')}
      </div>
      ${upsell}
      ${card('成员 × 项目', matrix + (t.invites.length ? `<div class="card-body muted">待接受的邀请：${t.invites.join('、')}</div>` : ''), { pad: false, sub: '每格是这个人在这个项目里的角色' })}
      ${card('近 30 天活动', heat)}
      <div class="grid g2">
        ${card('成员本月用量', chart(hbarChart({ items: t.members.map((m) => ({ label: USERS[m].name, value: USERS[m].used })).sort((a, b) => b.value - a.value) })), { sub: '点' })}
        ${card('空间构成', legend(STORE) + chart(stackBarH({ items: storage, series: STORE })), { sub: '按项目' })}
      </div>`;
  }

  // ---------- Billing ----------
  function plans() {
    return `
      ${card('套餐', `<table><thead><tr><th>套餐</th><th>价格</th><th class="n">月度点数</th><th>同步空间</th><th>项目成员上限</th><th>历史版本</th><th>可用模型</th><th class="n">用户</th><th>状态</th><th></th></tr></thead><tbody>${PLANS.map((p) => `<tr><td><b>${p.name}</b></td><td class="num">${p.price}<span class="muted"> · ${p.year}</span></td><td class="n">${fmt(p.points)}${p.id === 'team' ? ' / 人' : ''}</td><td>${p.storage}</td><td>${p.members}</td><td>${p.history}</td><td>${p.models}</td><td class="n">${fmt(p.users)}</td><td>${p.on ? chip('上架', 'ok') : chip(p.phase)}</td><td class="n"><button class="btn sm" data-act="dialog" data-kind="edit-plan" data-id="${p.id}">编辑</button></td></tr>`).join('')}</tbody></table>`, { pad: false, sub: '价格是建议值，待拍板', actions: '<button class="btn sm">' + icon('plus') + '新增套餐</button>' })}
      ${card('扣费和限制', `<div class="rules">
        <div class="rule"><div class="k">扣费顺序</div><div class="v">先扣最早到期的额度包</div></div>
        <div class="rule"><div class="k">余额不足</div><div class="v">拦新请求，进行中的做完；欠额下次先抵</div></div>
        <div class="rule"><div class="k">失败的请求</div><div class="v">上游报错不扣；中途停止按已生成的扣</div></div>
        <div class="rule"><div class="k">单日上限</div><div class="v">月度额度的 1/3，用户可以自己调低</div></div>
        <div class="rule"><div class="k">每分钟请求 · 同时进行</div><div class="v">免费 20 · 2；专业版 60 · 4</div></div>
        <div class="rule"><div class="k">单次最大输出</div><div class="v">32k token</div></div>
        <div class="rule"><div class="k">1 点</div><div class="v">¥0.01（按售价）</div></div>
        <div class="rule"><div class="k">毛利率提醒</div><div class="v">综合毛利率低于 ${MIN_MARGIN}%</div></div>
        <div class="rule"><div class="k">新用户</div><div class="v">注册送 1,000 点，30 天有效</div></div>
      </div>`, { actions: '<button class="btn sm" data-act="toast" data-text="原型里不能改规则">修改</button>' })}
      ${card('加油包', `<table><thead><tr><th>名称</th><th class="n">点数</th><th class="n">价格</th><th>有效期</th><th>可以买的套餐</th><th>状态</th></tr></thead><tbody>${[['小包', 500, 5], ['中包', 2000, 19], ['大包', 5000, 45]].map(([n, pts, yuan]) => `<tr><td>${n}</td><td class="n">${fmt(pts)}</td><td class="n">¥${yuan}</td><td>12 个月</td><td>免费、个人专业版</td><td>${chip('第二期')}</td></tr>`).join('')}</tbody></table>`, { pad: false, sub: '第二期接入在线支付后上架' })}`;
  }
  function codes() {
    return `
      <div class="toolbar"><span class="muted">兑换码只保存摘要，生成时显示一次，之后只能导出这一批的状态。</span><span class="grow"></span><button class="btn primary" data-act="dialog" data-kind="codes">${icon('plus')}生成兑换码</button></div>
      ${card('批次', `<table><thead><tr><th>批次</th><th>面值</th><th class="n">数量</th><th>已兑换</th><th>兑换截止</th><th>创建</th><th>状态</th><th></th></tr></thead><tbody>${BATCHES.map((b, i) => `<tr><td><b>${esc(b.name)}</b></td><td>${b.face}</td><td class="n">${b.count}</td><td>${meter(b.used, b.count, `${b.used} / ${b.count}`)}</td><td class="num">${b.until}</td><td class="muted">${b.created} · ${b.by}</td><td>${b.on ? chip('有效', 'ok') : chip('已结束')}</td><td class="n"><button class="btn sm" data-act="toast" data-text="已导出这一批的兑换状态">导出</button> ${b.on ? `<button class="btn sm danger" data-act="void-batch" data-id="${i}">作废</button>` : ''}</td></tr>`).join('')}</tbody></table>`, { pad: false })}`;
  }
  function models() {
    const tabs = `<div class="tabs"><button class="${S.modelTab === 'models' ? 'on' : ''}" data-act="set" data-key="modelTab" data-value="models">模型</button><button class="${S.modelTab === 'channels' ? 'on' : ''}" data-act="set" data-key="modelTab" data-value="channels">渠道</button></div>`;
    if (S.modelTab === 'channels') {
      return (
        tabs +
        `<div class="toolbar"><span class="muted">渠道是上游的模型服务。密钥加密保存，只显示末四位，能改不能看。</span><span class="grow"></span><button class="btn primary" data-act="dialog" data-kind="channel">${icon('plus')}新增渠道</button></div>` +
        card('渠道', `<table><thead><tr><th>渠道</th><th>地址</th><th>密钥</th><th>服务的模型</th><th class="n">24 小时请求</th><th class="n">错误率</th><th class="n">中位延迟</th><th>启用</th><th></th></tr></thead><tbody>${CHANNELS.map((c, i) => `<tr><td><b>${c.name}</b><div class="muted">OpenAI 兼容</div></td><td class="muted">${c.url}</td><td class="num">${icon('key')} ····${c.key}</td><td>${MODELS.filter((m) => m.channel === c.name || m.backup === c.name).map((m) => m.name + (m.backup === c.name ? '（备用）' : '')).join('、')}</td><td class="n">${fmt(c.req)}</td><td class="n">${c.err > 2 ? chip(icon('alert') + c.err + '%', 'warn') : c.err + '%'}</td><td class="n">${fmt(c.p50)} ms</td><td><button class="toggle ${c.on ? 'on' : ''}" data-act="toggle-channel" data-id="${i}" aria-label="启用"></button></td><td class="n"><button class="btn sm" data-act="toast" data-text="${c.name}：连接正常，${c.p50 - 200} ms">测试连接</button></td></tr>`).join('')}</tbody></table>`, { pad: false })
      );
    }
    return (
      tabs +
      `<div class="toolbar"><span class="muted">用户看到的是对外名称和倍率；成本价是上游价格，售价是扣的点数，单位都是每百万 token。</span><span class="grow"></span><button class="btn primary" data-act="dialog" data-kind="edit-model" data-id="new">${icon('plus')}新增模型</button></div>` +
      card('模型', `<table><thead><tr><th>对外名称</th><th>上游模型 · 渠道</th><th class="n">成本价 ¥<br><span class="muted">输入 / 缓存 / 输出</span></th><th class="n">售价 点<br><span class="muted">输入 / 缓存 / 输出</span></th><th class="n">倍率</th><th class="n">综合毛利率</th><th>开放给</th><th class="n">近 30 天</th><th>上架</th><th></th></tr></thead><tbody>${MODELS.map((m, i) => {
        const mg = margin(m);
        const pts = MODEL_DAILY.reduce((s, r) => s + r[m.id], 0);
        return `<tr><td><b>${m.name}</b> ${chip(m.tier)} ${m.def ? `<span class="muted" title="默认模型">${icon('star')}</span>` : ''}</td><td><span class="num">${m.upstream}</span><div class="muted">${m.channel}${m.backup ? ' · 备用 ' + m.backup : ''}</div></td><td class="n">${m.cost.join(' / ')}</td><td class="n">${m.price.map(fmt).join(' / ')}</td><td class="n">${times(m)}</td><td class="n">${mg < MIN_MARGIN ? chip(icon('alert') + mg + '%', 'bad') : mg + '%'}</td><td>${m.plans.join('、')}</td><td class="n">${short(pts)} 点</td><td><button class="toggle ${m.on ? 'on' : ''}" data-act="toggle-model" data-id="${i}" aria-label="上架"></button></td><td class="n"><button class="btn sm" data-act="dialog" data-kind="edit-model" data-id="${m.id}">编辑</button></td></tr>`;
      }).join('')}</tbody></table>`, { pad: false, sub: `综合毛利率按近 30 天的用量结构算（未命中输入 ${MIX[0] * 100}%、缓存命中 ${MIX[1] * 100}%、输出 ${MIX[2] * 100}%）` })
    );
  }
  function usage() {
    const top = USERS.filter((u) => u.status === 'active').sort((a, b) => b.used - a.used).slice(0, 10);
    const groups = [['user', '用户'], ['team', '团队'], ['model', '模型'], ['plan', '套餐']];
    let table = '';
    const head = '<th class="n">请求</th><th class="n">输入</th><th class="n">缓存命中</th><th class="n">输出</th><th class="n">点数</th><th class="n">上游成本</th><th class="n">估算的请求</th>';
    const cells = (pts, est = 1.2) => `<td class="n">${fmt(pts / 14)}</td><td class="n">${short(pts * 820)}</td><td class="n">${short(pts * 1060)}</td><td class="n">${short(pts * 160)}</td><td class="n">${fmt(pts)}</td><td class="n">${money(pts / 200)}</td><td class="n">${est.toFixed(1)}%</td>`;
    if (S.usageGroup === 'user') table = `<table><thead><tr><th>用户</th><th>套餐</th>${head}</tr></thead><tbody>${top.map((u) => `<tr class="click" data-act="user" data-id="${u.i}"><td class="who"><b>${esc(u.name)}</b><span class="muted num">${u.phone}</span></td><td>${planChip(u)}</td>${cells(u.used, u.i === 26 ? 0.4 : 1 + (u.i % 7) * 0.3)}</tr>`).join('')}</tbody></table>`;
    else if (S.usageGroup === 'team') table = `<table><thead><tr><th>团队</th><th>成员</th>${head}</tr></thead><tbody>${TEAMS.map(teamOf).sort((a, b) => b.points - a.points).map((t) => `<tr class="click" data-act="team" data-id="${t.id}"><td><b>${esc(t.name)}</b></td><td>${t.members.length} 人</td>${cells(t.points)}</tr>`).join('')}</tbody></table>`;
    else if (S.usageGroup === 'model') table = `<table><thead><tr><th>模型</th><th>渠道</th>${head}</tr></thead><tbody>${MODELS.map((m) => `<tr><td><b>${m.name}</b></td><td class="muted">${m.channel}</td>${cells(MODEL_DAILY.reduce((s, r) => s + r[m.id], 0), m.id === 'qwen' ? 3.8 : 1.1)}</tr>`).join('')}</tbody></table>`;
    else table = `<table><thead><tr><th>套餐</th><th>用户</th>${head}</tr></thead><tbody><tr><td><b>免费</b></td><td>1,221</td>${cells(96400)}</tr><tr><td><b>个人专业版</b></td><td>63</td>${cells(158900)}</tr></tbody></table>`;
    const total = MODEL_DAILY.reduce((s, r) => s + r.ds + r.glm + r.kimi + r.qwen, 0);
    return `
      <div class="toolbar">
        <div class="seg">${[7, 30, 90].map((d) => `<button class="${S.range === d ? 'on' : ''}" data-act="set" data-key="range" data-value="${d}">近 ${d} 天</button>`).join('')}</div>
        <span class="grow"></span>
        <button class="btn" data-act="toast" data-text="已导出 CSV">${icon('download')}导出 CSV</button>
      </div>
      <div class="tiles" style="grid-template-columns:repeat(5,1fr)">
        ${tile('请求', fmt(total / 4.2))}
        ${tile('token', short(total * 2040), '缓存命中 52%')}
        ${tile('扣除点数', short(total))}
        ${tile('上游成本', money(total / 200), '综合毛利 50%')}
        ${tile('估算的请求', '1.8%', '上游没报告用量，按字数估算')}
      </div>
      ${card('每日消耗', legend(SERIES) + chart(stackChart({ labels: DAYS.map(md), rows: MODEL_DAILY, series: SERIES })), { sub: `点 · 原型里 7 天和 90 天都显示 30 天的数据` })}
      ${card('明细', table, { pad: false, actions: `<div class="seg">${groups.map(([k, l]) => `<button class="${S.usageGroup === k ? 'on' : ''}" data-act="set" data-key="usageGroup" data-value="${k}">按${l}</button>`).join('')}</div>` })}`;
  }
  function orders() {
    return `
      <div class="toolbar"><span class="badge-phase">第一期：手动开通和兑换码；第二期：微信支付、支付宝、退款和发票申请</span><span class="grow"></span><button class="btn primary" data-act="dialog" data-kind="plan" data-pickuser="1">${icon('plus')}手动开通</button></div>

  // ---------- Dialogs ----------
  let dialog = null;
  function openDialog(kind, data = {}) {
    dialog = { kind, ...data };
    renderDialog();
  }
  function closeDialog() {
    dialog = null;
    document.getElementById('layer').innerHTML = '';
  }
  const frame = (title, body, foot, wide = false) =>
    `<div class="scrim" data-act="scrim"><div class="dialog ${wide ? 'wide' : ''}" role="dialog" aria-label="${title}"><header><h3>${title}</h3><button class="icon-btn" data-act="close">${icon('x')}</button></header><div class="body">${body}</div><footer>${foot}</footer></div></div>`;
  function renderDialog() {
    if (!dialog) return;
    const u = S.user != null ? USERS[S.user] : null;
    let html = '';
    if (dialog.kind === 'credit') {
      const sign = dialog.sign ?? 1;
      const pts = dialog.points ?? 200;
      html = frame(
        `调整额度 · ${esc(u.name)}`,
        `<div class="seg"><button class="${sign > 0 ? 'on' : ''}" data-act="dlg" data-key="sign" data-value="1">增加</button><button class="${sign < 0 ? 'on' : ''}" data-act="dlg" data-key="sign" data-value="-1">扣减</button></div>

        <div class="brand"><span class="logo">${icon('box')}</span><span>Scientify<small>管理后台</small></span></div>
        ${NAV.map((n) => (n.group ? `<div class="nav-group">${n.group}</div>` : `<button class="nav-item ${S.view === n.id ? 'on' : ''}" data-act="go" data-view="${n.id}">${icon(n.icon)}${n.name}${n.id === 'orders' ? '<span class="tag">第一期手动</span>' : ''}</button>`)).join('')}
        <div class="side-foot"><div class="avatar sm">林</div><div class="me"><b>林</b><span>所有者</span></div><button class="icon-btn" data-act="theme" title="切换深色">${icon('moon')}</button><button class="icon-btn" data-act="sign-out" title="退出">${icon('logout')}</button></div>
      </aside>
      <main class="main">
        <div class="top">${title()}<span class="spacer"></span><span class="muted">数据截至 2026-11-16 14:30 · 原型数据均为虚构</span><button class="btn" data-act="client-open">${icon('monitor')}用户端</button></div>
        <div class="content">${page()}</div>
      </main>
    </div>${S.client ? client() : ''}`;
    if (keepScroll) {
      const content = root.querySelector('.content');
      if (content) content.scrollTop = scroll;
      const panel = root.querySelector('.client');
      if (panel) panel.scrollTop = clientScroll;
    }
    keepScroll = false;
    drawCharts();
  }
  function drawCharts() {
    document.querySelectorAll('[data-chart]').forEach((el) => {
      const draw = CHARTS[el.dataset.chart];
      if (draw) el.innerHTML = draw(Math.max(200, el.clientWidth));
    });
  }

  // ---------- Toast and tooltip ----------
  let toastTimer = 0;
  function toast(text) {
    document.querySelector('.toast')?.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = icon('ok') + esc(text);
    document.body.append(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2600);
  }
  const tipEl = document.createElement('div');
  tipEl.className = 'tip';
  tipEl.style.display = 'none';
  document.addEventListener('mousemove', (event) => {
    const target = event.target.closest?.('[data-tip]');
    document.querySelectorAll('.cross').forEach((c) => (c.style.display = 'none'));
    if (!target || !TIPS[target.dataset.tip]) {
      tipEl.style.display = 'none';
      return;
    }
    if (!tipEl.isConnected) document.body.append(tipEl);
    tipEl.innerHTML = TIPS[target.dataset.tip];
    tipEl.style.display = 'block';
    const box = tipEl.getBoundingClientRect();
    let x = event.clientX + 14;
    let y = event.clientY + 14;
    if (x + box.width > innerWidth - 8) x = event.clientX - box.width - 14;
    if (y + box.height > innerHeight - 8) y = event.clientY - box.height - 14;
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
    if (target.dataset.cx) {
      const cross = target.closest('svg').querySelector('.cross');
      cross.setAttribute('x1', target.dataset.cx);
      cross.setAttribute('x2', target.dataset.cx);
      cross.style.display = '';
    }
  });
  document.addEventListener('mouseover', (event) => {
    const t = event.target.closest?.('[data-hover-team]');
    const next = t ? t.dataset.hoverTeam : null;
    if (S.view !== 'teams' || S.team || next === S.hl) return;
    S.hl = next;
    document.querySelectorAll('.graph .hull').forEach((h) => h.classList.toggle('hl', h.dataset.hoverTeam === next));
    document.querySelectorAll('.team-list .team').forEach((h) => h.classList.toggle('hl', h.dataset.hoverTeam === next));
  });

  // ---------- Events ----------
  let auditMinute = 30;
  function record(action, target, content, reason) {
    AUDIT.unshift([`11-16 14:${auditMinute++}`, '林 · 所有者', action, target, content, reason || '—', '10.2.0.8']);
  }
  document.addEventListener('click', (event) => {
    const el = event.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const d = el.dataset;
    if (act === 'scrim' && event.target !== el) return;
    switch (act) {
      case 'go':
        S.view = d.view;
        S.user = null;
        S.team = null;
        S.userTab = 'overview';
        if (d.plan) S.plan = d.plan;
        if (d.tab) S.modelTab = d.tab;
        S.client = false;
        render();
        break;
      case 'set':
        S[d.key] = d.key === 'range' ? Number(d.value) : d.value;
        keepScroll = d.key === 'clientState' || d.key === 'usageGroup';
        render();
        break;
      case 'user':
        S.view = 'users';
        S.user = Number(d.id);
        S.team = null;
        S.userTab = 'overview';
        render();
        break;
      case 'team':
        S.view = 'teams';
        S.team = d.id;
        S.user = null;
        S.hl = null;
        render();
        break;
      case 'reveal':
        S.shown[USERS[d.id].id] = true;
        record('显示手机号', '用户 ' + USERS[d.id].name, '—', '客服核实');
        toast('已显示完整手机号，并记入审计');
        keepScroll = true;
        render();
        break;
      case 'dialog':
        openDialog(d.kind, { id: d.id, pickuser: d.pickuser });
        break;
      case 'edit-model':
        openDialog('edit-model', { id: d.id });
        break;
      case 'dlg':
        dialog[d.key] = d.key === 'sign' ? Number(d.value) : d.value;
        renderDialog();
        break;
      case 'model-plan': {
        const list = dialog.draft.plans;
        const i = list.indexOf(d.value);
        if (i >= 0) list.splice(i, 1);
        else list.push(d.value);
        renderDialog();
        break;
      }
      case 'close':
      case 'scrim':
        closeDialog();
        break;
      case 'apply-credit': {
        const u = USERS[S.user];
        const pts = Number(dialog.points ?? 200) || 0;
        const sign = dialog.sign ?? 1;
        if (sign > 0) u.extra.push({ src: '人工调整', total: pts, left: pts, start: '2026-11-16', end: '2027-02-14' });
        else u.used = Math.min(u.quota, u.used + pts);
        record(sign > 0 ? '补偿额度' : '扣减额度', '用户 ' + u.name, `${sign > 0 ? '+' : '−'}${pts} 点${sign > 0 ? '，90 天有效' : ''}`, '同步或服务故障补偿');
        closeDialog();
        toast(`已${sign > 0 ? '增加' : '扣减'} ${pts} 点，并记入审计`);
        keepScroll = true;
        render();
        break;
      }
      case 'apply-plan':
        if (S.user != null && !dialog.pickuser) record('更改套餐', '用户 ' + USERS[S.user].name, '个人专业版，顺延 12 个月', '对公转账');
        else record('手动开通', '用户 张卫东', '个人专业版，顺延 12 个月', '对公转账 ¥288');
        closeDialog();
        toast('已开通，已生成订单并记入审计');
        render();
        break;
      case 'apply-limits':
        USERS[S.user].limits = { daily: Number(document.querySelector('[data-dlg="daily"]').value) || 0 };
        record('单独限制', '用户 ' + USERS[S.user].name, '单日上限 ' + USERS[S.user].limits.daily + ' 点，7 天后恢复', '用量异常');
        closeDialog();
        toast('已保存，立即生效');
        keepScroll = true;
        render();
        break;
      case 'apply-disable': {
        const input = document.querySelector('[data-dlg="reason"]');
        const reason = input.value.trim();
        if (!reason) {
          input.focus();
          toast('请填写原因');
          break;
        }
        const u = USERS[S.user];
        u.status = 'disabled';
        u.reason = reason;
        record('停用账号', '用户 ' + u.name, '正常 → 停用', reason);
        closeDialog();
        toast('已停用，所有设备已下线');
        render();
        break;
      }
      case 'enable': {
        const u = USERS[S.user];
        u.status = 'active';
        record('恢复账号', '用户 ' + u.name, '停用 → 正常', '—');
        toast('已恢复');
        render();
        break;
      }
      case 'confirm-logout':
        record('强制下线', '用户 ' + USERS[S.user].name, `${USERS[S.user].devices} 台设备`, '—');
        toast(`已让 ${USERS[S.user].devices} 台设备下线，模型令牌一并吊销`);
        break;
      case 'apply-codes':
        BATCHES.unshift({ name: '12 月学院讲座', face: dialog.face === 'points' ? '2,000 点 · 90 天' : '个人专业版 · 1 个月', count: 50, used: 0, until: '2026-12-31', by: '林', created: '11-16', on: true });
        record('生成兑换码', '批次 12 月学院讲座', '50 个', '—');
        dialog.done = true;
        render();
        renderDialog();
        break;
      case 'void-batch':
        BATCHES[d.id].on = false;
        record('作废兑换码', '批次 ' + BATCHES[d.id].name, `未兑换的 ${BATCHES[d.id].count - BATCHES[d.id].used} 个作废`, '—');
        toast('未兑换的兑换码已作废');
        render();
        break;
      case 'apply-model': {
        const target = MODELS.find((m) => m.id === dialog.id);
        if (target) {
          target.cost = dialog.draft.cost.map(Number);
          target.price = dialog.draft.price.map(Number);
          target.plans = dialog.draft.plans;
          record('修改模型价格', target.name, `售价 ${target.price.join(' / ')} 点`, '—');
        }
        closeDialog();
        toast('已保存，下一次请求开始生效');
        render();
        break;
      }
      case 'apply-generic':
        closeDialog();
        toast(d.text);
        break;
      case 'toggle-model':
        MODELS[d.id].on = !MODELS[d.id].on;
        record(MODELS[d.id].on ? '上架模型' : '下架模型', MODELS[d.id].name, '—', '—');
        keepScroll = true;
        render();
        break;
      case 'toggle-channel':
        CHANNELS[d.id].on = !CHANNELS[d.id].on;
        toast(CHANNELS[d.id].on ? '已启用' : '已停用，相关模型改走备用渠道');
        keepScroll = true;
        render();
        break;
      case 'toast':
        toast(d.text);
        break;
      case 'theme':
        S.theme = S.theme === 'light' ? 'night' : 'light';
        keepScroll = true;
        render();
        break;
      case 'client-open':
        S.client = true;
        render();
        break;
      case 'client-close':
        S.client = false;
        render();
        break;
      case 'sign-out':
        S.signedIn = false;
        render();
        break;
      case 'sign-in':
        S.signedIn = true;
        render();
        break;
    }
  });
  document.addEventListener('input', (event) => {
    const el = event.target;
    const refocus = (selector, pos) => {
      const again = document.querySelector(selector);
      again.focus();
      again.setSelectionRange(pos, pos);
    };
    if (el.dataset.input === 'q') {
      S.q = el.value;
      const pos = el.selectionStart;
      render();
      refocus('[data-input="q"]', pos);
    } else if (el.dataset.dlg === 'points') {
      dialog.points = Number(el.value) || 0;
      const pos = el.selectionStart;
      renderDialog();
      refocus('[data-dlg="points"]', pos);
    } else if (el.dataset.model) {
      dialog.draft[el.dataset.model][Number(el.dataset.i)] = el.value;
      const pos = el.selectionStart;
      renderDialog();
      refocus(`[data-model="${el.dataset.model}"][data-i="${el.dataset.i}"]`, pos);
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (dialog) closeDialog();
    else if (S.client) {
      S.client = false;
      render();
    }
  });
  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawCharts, 120);
  });

  render();
})();

</script>
</body>
</html>
