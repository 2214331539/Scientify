<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scientify 项目中心 · 交互原型</title>
<style>
:root{--ink:#242727;--ink2:#555b5b;--muted:#6b7170;--faint:#9aa2a8;--line:#e5e7e6;--line2:#d1d6d4;--hover:#f2f3f2;--accent:#3d4643;--accent2:#282f2c;--ok:#246b45;--warn:#865a16;--bad:#b03636;--info:#2e65a4;
--ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;--mac:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:#e9ecee;font:13px/1.55 var(--ui);color:var(--ink)}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}

/* ---------- 评审框架 ---------- */
.rv{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
.rv-t{display:flex;align-items:center;gap:9px;margin-right:4px}
.rv-t img{width:22px;height:22px}
.rv-t b{font-size:14px}
.rv-t span{color:var(--muted);font-size:12.5px}
.rv-g{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#eef0ef;border-radius:7px;padding:2px;gap:1px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:5px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rv-sp{flex:1}
.rv-tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:3px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.rv-tog.on{background:#eef0ef;color:var(--ink);font-weight:600}
.main{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.deskbox{position:relative;flex:none}
.desk{position:absolute;left:0;top:0;transform-origin:0 0;padding:28px;border-radius:14px;background:linear-gradient(150deg,#dde4ea 0%,#eceff1 55%,#e4e8ec 100%)}
.desk.mac{padding-top:52px}
.mbar{display:none}
.desk.mac .mbar{display:flex;position:absolute;left:0;right:0;top:0;height:26px;align-items:center;padding:0 12px;gap:2px;background:rgba(255,255,255,.7);border-bottom:1px solid rgba(0,0,0,.06);border-radius:14px 14px 0 0;font:13px/1 var(--mac);color:#1d1d1f;z-index:30}
.mbar>span{padding:4px 9px;border-radius:5px;cursor:default;position:relative;white-space:nowrap}
.mbar>span.app{font-weight:700}
.mbar>span:hover,.mbar>span.on{background:rgba(0,0,0,.09)}
.mbar>span.clk{margin-left:auto;font-size:12.5px;background:transparent}
.mbar .menu{top:25px;left:0;line-height:1.5}

/* ---------- 设计说明 ---------- */
.notes{width:376px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto}
.notes[hidden]{display:none}
.nt-tabs{position:sticky;top:0;background:#fff;display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);z-index:1}
.nt-tabs button{border:0;background:transparent;padding:7px 10px 9px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.nt-tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.nt{padding:16px 20px 36px}
.nt h2{font-size:17px;margin:0 0 4px}
.nt .pp{margin:0 0 6px;color:var(--ink2)}
.nt h3{font-size:12.5px;font-weight:600;margin:16px 0 6px}
.nt ul{margin:0;padding:0;list-style:none}
.nt li{position:relative;padding:3px 0 3px 14px;color:var(--ink2);font-size:12.5px;line-height:1.65}
.nt ul li::before{content:"";position:absolute;left:3px;top:11px;width:4px;height:4px;border-radius:50%;background:#b8bfbc}
.nt ol{margin:0;padding-left:18px;color:var(--ink2);font-size:12.5px}
.nt ol li{padding:3px 0 3px 2px}
.nt b{color:var(--ink)}
.tg{display:inline-block;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;border:1px solid;vertical-align:1px;font-weight:500;white-space:nowrap;margin-right:5px}
.tg.n{color:var(--info);border-color:#c5d6ec;background:#f2f6fc}
.tg.c{color:var(--warn);border-color:#e8d6b3;background:#fcf7ee}
.tg.h{color:var(--ok);border-color:#bfdccb;background:#f2f8f4}
.tg.t{color:var(--muted);border-color:var(--line2);background:#f7f7f7}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin:10px 0 2px}
.tries{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tries button{border:1px solid var(--line2);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.tries button:hover{border-color:var(--ink2);color:var(--ink)}

/* ---------- 窗口 ---------- */
#win{position:relative;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);background:#fff;overflow:hidden;color:var(--ink);font-size:13px;line-height:1.5}
#win.p-win{border-radius:8px;font-family:var(--ui);box-shadow:0 0 0 1px rgba(0,0,0,.14),0 22px 56px -14px rgba(20,30,40,.38)}
#win.p-mac{border-radius:11px;font-family:var(--mac);box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 26px 64px -12px rgba(20,30,40,.42)}
#win.sz-md{--sbw:224px;--bw:132px;--hb:112px}
#win.sz-lg{--sbw:240px;--bw:140px;--hb:120px}
#win.sz-sm{--sbw:196px;--bw:112px;--hb:104px}

.sb{display:flex;flex-direction:column;min-height:0;background:#f7f7f7;border-right:1px solid var(--line)}
.p-mac .sb{background:linear-gradient(180deg,#f0f0ef,#ebebea);border-right-color:#dcdcdb}
.sb-top{height:48px;flex:none;display:flex;align-items:center;gap:9px;padding:0 18px}
.p-mac .sb-top{height:52px;padding:0 16px}
.sb-top img{width:20px;height:20px}
.sb-top b{font-size:14px}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.sb-s{margin:2px 10px 10px;height:30px;display:flex;align-items:center;gap:8px;padding:0 9px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;font-size:12.5px}
.p-mac .sb-s{height:28px;background:rgba(0,0,0,.05);border-color:transparent;border-radius:7px}
.sb-s:hover{border-color:#b9c0bd}
.kb{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.sb-n{padding:0 8px;display:flex;flex-direction:column;gap:1px}
.nv{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.p-mac .nv{height:28px;gap:8px;padding:0 8px}
.nv:hover{background:rgba(0,0,0,.045)}
.nv.on{background:rgba(0,0,0,.08);color:var(--ink);font-weight:600}
.nv .c{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.nv .dt{width:7px;height:7px;border-radius:50%;background:var(--info);margin-left:auto}
.nv .dt+.c{margin-left:7px}
.sb-h{display:flex;align-items:center;gap:4px;margin:16px 18px 4px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;user-select:none}
.p-mac .sb-h{margin-left:16px}
.sb-h .ic{transition:transform .15s}
.sb-h.closed .ic{transform:rotate(-90deg)}
.fv{height:28px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:6px;color:var(--ink2);cursor:pointer;font-size:12.5px;white-space:nowrap;min-width:0}
.p-mac .fv{height:26px;padding:0 8px}
.fv:hover{background:rgba(0,0,0,.045)}
.fv span{overflow:hidden;text-overflow:ellipsis}
.fv .ic{color:var(--faint);margin-left:auto}
.mb{width:10px;height:13px;flex:none;border-radius:1px 2px 2px 1px;background:var(--c);box-shadow:inset 2px 0 0 rgba(0,0,0,.2)}
.sb-f{margin-top:auto;padding:8px;border-top:1px solid var(--line);display:flex;align-items:center;gap:2px}
.p-mac .sb-f{border-top-color:#dcdcdb}
.ac{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer}
.ac:hover{background:rgba(0,0,0,.05)}
.ac>div{min-width:0}
.ac b{display:block;font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);line-height:1.35;white-space:nowrap;min-width:0}
.ac small span{overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:#dfe5e2;color:#3d4643;font-size:12px;font-weight:600}
.av.g{background:#e6e8e8;color:var(--muted)}
.sd{width:6px;height:6px;border-radius:50%;background:#3c9a62;flex:none}
.sd.off{background:#aab1ae}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--ink2);cursor:pointer;flex:none;padding:0}
.ib:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.ib.sm{width:22px;height:22px}

.mn{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding-left:24px}
.p-mac .tb{height:52px;padding-right:16px}
.tb h1{margin:0;font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.p-mac .tb h1{font-size:15px;font-weight:700}
.tb h1 .c{font-size:12.5px;font-weight:400;color:var(--faint)}
.tb-a{margin-left:auto;display:flex;align-items:center;gap:8px}
.caps{display:flex;align-self:stretch;margin-left:12px}
.caps span{width:46px;display:grid;place-items:center;color:var(--ink2)}
.caps span:hover{background:rgba(0,0,0,.06)}
.caps span.x:hover{background:#c42b1c;color:#fff}
.ct{flex:1;min-height:0;overflow:auto;padding:4px 24px 28px}

.bt{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;line-height:1}
.p-mac .bt{height:28px;padding:0 11px}
.bt:hover{background:#f6f7f6;border-color:#bfc6c3}
.bt:disabled{opacity:.45;cursor:default;pointer-events:none}
.bt.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.bt.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.bt.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.bt.dng:hover{background:#962c2c}
.bt.gh{border-color:transparent;background:transparent;color:var(--ink2)}
.bt.gh:hover{background:var(--hover);color:var(--ink)}
.bt.sm,.p-mac .bt.sm{height:26px;padding:0 9px;font-size:12px;gap:5px}
.bt.lk{border:0;background:transparent;padding:0 2px;height:auto;color:var(--info);font-size:12.5px;gap:3px}
.bt.lk:hover{text-decoration:underline;background:transparent}
.bt.lk.mu{color:var(--muted)}
.sz-sm .bt .lbl{display:none}
.spl{display:inline-flex}
.spl .bt:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.spl .bt:last-child{border-top-left-radius:0;border-bottom-left-radius:0;padding:0 7px;border-left-color:rgba(255,255,255,.24)}

.sx{height:30px;width:236px;display:flex;align-items:center;gap:7px;padding:0 6px 0 9px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--faint);cursor:text}
.p-mac .sx{height:28px;background:rgba(0,0,0,.045);border-color:transparent;border-radius:7px}
.sx:focus-within{border-color:#8c9592;box-shadow:0 0 0 3px rgba(61,70,67,.1);background:#fff}
.sx input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink)}
.sx input::placeholder{color:var(--faint)}
.sz-sm .sx{width:150px}
.sz-lg .sx{width:280px}

.fr{display:flex;align-items:center;gap:4px;margin:2px 0 18px;min-height:30px}
.chp{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:0;border-radius:14px;background:transparent;color:var(--ink2);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chp:hover{background:var(--hover);color:var(--ink)}
.chp.on{background:#e9ebea;color:var(--ink);font-weight:600}
.chp .c{color:var(--faint);font-weight:400}
.fr .sp{flex:1}
.vt{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-left:4px}
.vt button{width:30px;height:26px;display:grid;place-items:center;border:0;background:#fff;color:var(--muted);cursor:pointer;padding:0}
.vt button+button{border-left:1px solid var(--line2)}
.vt button.on{background:#eceeed;color:var(--ink)}

/* 书本封面 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,var(--bw));gap:26px 28px;align-items:start}
.bi{width:var(--bw);min-width:0}
.hshelf{display:flex;gap:24px}
.hshelf .bi{width:var(--hb)}
.bk{position:relative;width:100%;aspect-ratio:3/4;border-radius:2px 6px 6px 2px;background:var(--c);cursor:pointer;overflow:hidden;box-shadow:inset 7px 0 0 rgba(0,0,0,.16),inset 8px 0 0 rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.12),0 8px 18px -8px rgba(15,25,35,.45);transition:transform .18s ease,box-shadow .18s ease}
.bk::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 6%,rgba(255,255,255,.13) 14%,rgba(255,255,255,0) 32%,rgba(0,0,0,.06) 100%);pointer-events:none}
.bk:hover{transform:translateY(-3px);box-shadow:inset 7px 0 0 rgba(0,0,0,.16),inset 8px 0 0 rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.12),0 16px 26px -10px rgba(15,25,35,.5)}
.bk.static{cursor:default}
.bk.static:hover{transform:none}
.bk-f{position:absolute;left:18px;right:28px;top:13px;font-size:10.5px;letter-spacing:.03em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-n{position:absolute;left:18px;right:12px;bottom:32px;font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;text-wrap:balance}
.hshelf .bk-n,.np-p .bk-n{font-size:13.5px;bottom:30px}
.sz-sm .bk-n{font-size:13.5px}
.bk-b{position:absolute;left:18px;bottom:11px;display:flex;gap:7px;opacity:.85}
.rib{position:absolute;top:0;right:12px;width:11px;height:22px;background:#e3a33c;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.bk-m{position:absolute;bottom:7px;right:7px;width:24px;height:24px;border-radius:6px;border:0;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--ink);opacity:0;cursor:pointer;transition:opacity .12s;padding:0}
.bk:hover .bk-m,.bk-m.on{opacity:1}
.bk.arch{filter:saturate(.25) brightness(1.06);opacity:.8}
.bk.remote{opacity:.6}
.bk.remote:hover{opacity:.85}
.bk-meta{margin-top:9px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.bk-meta .ic{color:var(--faint)}
.bk.new{background:transparent;box-shadow:none;border:1.5px dashed #c8cfcc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.bk.new::before{display:none}
.bk.new:hover{background:#fafbfa;border-color:#a9b2ae;color:var(--ink);transform:none;box-shadow:none}
.mbk{display:inline-block;width:22px;height:29px;flex:none;border-radius:1px 3px 3px 1px;background:var(--c);box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.15)}

/* 首页 */
.sec{margin-top:26px}
.sec:first-child{margin-top:8px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:22px}
.sh h2{margin:0;font-size:13.5px;font-weight:600}
.sh .c{font-size:12px;color:var(--faint)}
.sh .r{margin-left:auto}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px}
.sz-sm .cols{grid-template-columns:1fr;gap:0}
.sz-sm .cols>section:last-child{order:-1;margin-bottom:18px}
.rc{display:flex;align-items:center;gap:12px;padding:8px 10px;margin:0 -10px;border-radius:8px;cursor:pointer}
.rc:hover{background:#f5f6f5}
.ti{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.ti.paper{background:#edf2fa;color:#2e65a4}
.ti.note{background:#fbf3e4;color:#8a5d14}
.ti.run{background:#ecf5ef;color:#246b45}
.ti.draft{background:#f3eff8;color:#6b5a8a}
.ti.chat{background:#eef0f0;color:#4c5453}
.rc-m{min-width:0;flex:1}
.rc-m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-m small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.pj{display:inline-flex;align-items:center;gap:5px;color:var(--ink2)}
.pj i{width:8px;height:10px;border-radius:1px 2px 2px 1px;background:var(--c);flex:none}
.rc .w{font-size:12px;color:var(--faint);white-space:nowrap}
.pd{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
.pd-i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.pd-i.info{background:#edf2fa;color:var(--info)}
.pd-i.warn{background:#fbf3e4;color:var(--warn)}
.pd-i.bad{background:#fbeded;color:var(--bad)}
.pd-m{min-width:0;flex:1}
.pd-m b{display:block;font-weight:500;font-size:12.5px;line-height:1.45}
.pd-m small{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
.pd-a{display:flex;gap:6px;margin-top:8px}
.none{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:8px 0}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,230px));gap:14px}
.sz-sm .qs{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{border:1px solid var(--line);border-radius:10px;padding:16px 16px 18px;cursor:pointer;background:#fff;transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:#c3cac7;box-shadow:0 3px 12px -4px rgba(0,0,0,.12)}
.tile .ti{margin-bottom:14px;width:34px;height:34px}
.tile b{display:block;font-size:13.5px}
.tile p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.dataloc{margin-top:20px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
code{font-family:var(--ui);font-size:12px;color:var(--ink2);background:#f3f4f3;padding:1px 6px;border-radius:4px}

/* 表格 */
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.tbl th{height:32px;font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl th .ic{display:inline-block;vertical-align:-2px}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f1f0;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:#f8f9f8}
.tbl tr.r.sel td{background:#eef0ef}
.nm{display:flex;align-items:center;gap:11px;min-width:0}
.nm>div{min-width:0}
.nm b{display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;overflow:hidden}

  }).join('');

function openMenu(type, id, el, ev) {
  const win = $('#win');
  const wr = win.getBoundingClientRect();
  const s = S.scale;
  if (ev && ev.type === 'contextmenu') { S.menu = { type, id, x: (ev.clientX - wr.left) / s, y: (ev.clientY - wr.top) / s }; render(); return; }
  const r = el.getBoundingClientRect();
  if (type === 'account' || type === 'help') { S.menu = { type, id, x: (r.left - wr.left) / s, bottom: (wr.bottom - r.top) / s + 6 }; render(); return; }
  S.menu = { type, id, x: (r.left - wr.left) / s, y: (r.bottom - wr.top) / s + 4, right: (r.right - wr.left) / s };
  render();
}
function placeMenu() {
  const m = $('#win > .menu');
  if (!m || !S.menu) return;
  const win = $('#win');
  const W = win.offsetWidth, H = win.offsetHeight, mw = m.offsetWidth, mh = m.offsetHeight;
  let x = S.menu.x;
  if (x + mw > W - 8) x = Math.max(8, (S.menu.right != null ? S.menu.right : W - 8) - mw);
  m.style.left = x + 'px';
  if (S.menu.y != null) { let y = S.menu.y; if (y + mh > H - 8) y = Math.max(8, H - mh - 8); m.style.top = y + 'px'; }
}

/* ---------- 搜索面板 ---------- */
function cmdk() {
  const q = S.cmd.q.trim();
  const cmdMode = q.startsWith('>');
  const qq = (cmdMode ? q.slice(1) : q).trim().toLowerCase();
  const CMDS = [['新建项目', 'plus', 'dlg:new', key('N')], ['打开文件夹作为项目', 'folder-input', 'dlg:folder', key('O')], ['打开示例项目', 'book-open', 'sample', ''], ['前往首页', 'house', 'nav:home', key('1')], ['前往我的项目', 'folder', 'nav:mine', key('2')], ['前往团队项目', 'users', 'nav:team', key('3')], ['前往收集箱', 'inbox', 'nav:inbox', key('4')], ['新建随手笔记', 'notebook-pen', 'newnote', ''], ['打开设置', 'settings', 'settings', key(',')]].map(([l, i, a, k]) => ({ l, i, a, k }));
  const groups = [];
  if (cmdMode) groups.push(['命令', CMDS.filter((c) => !qq || c.l.toLowerCase().includes(qq))]);
  else if (!qq) {
    groups.push(['最近打开', D.recents.filter((r) => proj(r.p)).slice(0, 4).map((r) => ({ l: r.title, i: TICON[r.t], a: `open:${r.p}:${r.t}`, k: proj(r.p).name }))]);
    groups.push(['命令', CMDS.slice(0, 3)]);
  } else {
    groups.push(['项目', [...D.projects, ...(S.logged ? D.team : [])].filter((p) => (p.name + p.q).toLowerCase().includes(qq)).map((p) => ({ l: p.name, i: p.team ? 'users' : 'folder', a: `open:${p.id}`, k: p.team ? '团队项目' : p.archived ? '已归档' : '我的项目' }))]);
    groups.push(['论文、笔记和运行', D.recents.filter((r) => proj(r.p) && r.title.toLowerCase().includes(qq)).map((r) => ({ l: r.title, i: TICON[r.t], a: `open:${r.p}:${r.t}`, k: proj(r.p).name }))]);
    groups.push(['收集箱', D.inbox.filter((n) => (n.title + n.body).toLowerCase().includes(qq)).map((n) => ({ l: n.title, i: 'notebook-pen', a: `goinbox:${n.id}`, k: '随手笔记' }))]);
  }
  const live = groups.filter((g) => g[1].length);
  S.cmdFlat = live.flatMap((g) => g[1]);
  const idx = Math.min(S.cmd.i, S.cmdFlat.length - 1);
  let n = 0;
  const res = live.map(([h, items]) => `<h6>${h}</h6>` + items.map((it) => `<div class="co ${n++ === idx ? 'on' : ''}" data-a="${it.a}">${ic(it.i, 15)}<span>${esc(it.l)}</span>${it.k ? `<small>${esc(it.k)}</small>` : ''}</div>`).join('')).join('') || `<div class="none" style="padding:12px 10px">${ic('search', 15)}没有结果。输入 &gt; 查看全部命令。</div>`;
  return `<div class="cmdk" data-a="cmdclose"><div class="cmdk-b" data-stop="1"><div class="cmdk-i">${ic('search', 17)}<input data-in="cmdq" data-fk="cmdq" placeholder="搜索项目、论文和笔记，输入 > 执行命令" value="${esc(S.cmd.q)}"><span class="kb">Esc</span></div><div class="cmdk-r">${res}</div><div class="cmdk-f"><span>↑↓ 选择</span><span>Enter 打开</span><span>&gt; 命令</span><span>Esc 关闭</span></div></div></div>`;
}

    case 'arch': { const p = proj(x); p.archived = !p.archived; S.dlg = S.prev = null; toast(p.archived ? `已归档「${p.name}」` : `已恢复「${p.name}」`, () => { p.archived = !p.archived; }); break; }
    case 'reveal': { const p = proj(x); toast(`${reveal()}：${pth('code', p)}`); break; }
    case 'dlg': S.cmd = null; openDlg(x, y); break;
    case 'close': closeDlg(); break;
    case 'dstep': d.step = +x; if (d.step === 1) S.autofocus = 'd-name'; break;
    case 'dset': d[x] = rest.slice(x.length + 1); break;
    case 'dtoggle': d[x] = !d[x]; break;
    case 'cyclerole': d.role = { editor: 'reviewer', reviewer: 'viewer', viewer: 'editor' }[d.role]; break;
    case 'addinv': if (validPhone(d.phone)) { d.invites.push({ ph: d.phone.trim(), role: d.role }); d.phone = ''; S.autofocus = 'd-phone'; } break;
    case 'rminv': d.invites.splice(+x, 1); break;
    case 'create': {
      const id = 'n' + Date.now();
      const base = { id, name: d.name.trim(), field: d.field.trim() || '未分类', q: d.q.trim() || '还没有填写研究问题', color: d.color, opened: '刚刚', o: 0, u: 0, created: '2026-11-04', papers: 0, notes: 0, runs: 0, dir: d.name.trim() };
      if (d.mode === 'team') { D.team.unshift({ ...base, team: true, owner: '我', role: 'owner', local: 'synced', last: '刚刚', by: '我', when: '刚刚', members: [{ ...ME, role: 'owner' }, ...d.invites.map((v) => ({ ph: mask(v.ph), role: v.role, pending: true }))] }); S.page = 'team'; S.tsel = id; }
      else { D.projects.unshift({ ...base, sync: d.sync ? 'on' : undefined }); S.page = 'mine'; S.filter = 'all'; }
      S.dlg = null; toast(`已创建「${base.name}」，正在打开项目窗口`); break;
    }
    case 'createfolder': D.projects.unshift({ id: 'n' + Date.now(), name: d.name.trim(), field: '未分类', q: d.q.trim() || '还没有填写研究问题', color: '#3f7a7a', opened: '刚刚', o: 0, u: 0, created: '2026-11-04', papers: 18, notes: 0, runs: 0, dir: 'token-pruning' }); S.dlg = null; S.page = 'mine'; toast(`已创建「${d.name.trim()}」，正在打开项目窗口`); break;
    case 'saveedit': { const p = proj(d.arg); Object.assign(p, { name: d.name.trim(), q: d.q.trim(), field: d.field.trim(), color: d.color }); S.dlg = null; toast('已保存'); break; }
    case 'delete': { const p = proj(x); D.projects = D.projects.filter((q) => q.id !== x); D.recents = D.recents.filter((r) => r.p !== x); S.dlg = null; toast(`已删除「${p.name}」`); break; }
    case 'doshare': {
      const p = proj(d.pid);
      D.projects = D.projects.filter((q) => q.id !== p.id);
      D.team.unshift({ ...p, team: true, sync: undefined, owner: '我', role: 'owner', local: 'synced', last: '刚刚', by: '我', when: '刚刚', o: 0, members: [{ ...ME, role: 'owner' }, ...d.invites.map((v) => ({ ph: mask(v.ph), role: v.role, pending: true }))] });
      S.dlg = null; S.page = 'team'; S.tsel = p.id; S.tfilter = 'all'; toast(`已共享「${p.name}」，现在在团队项目里`); break;
    }
    case 'doinvite': { const t = proj(d.arg); t.members.push({ ph: mask(d.phone.trim()), role: d.role, pending: true }); S.dlg = null; toast(`已邀请 ${mask(d.phone.trim())}（${ROLES[d.role]}）`); break; }
    case 'setrole': { const [tid, idx, r] = x.split('|'); const m = proj(tid).members[+idx]; m.role = r; toast(`已把 ${m.n || m.ph} 的角色改为${ROLES[r]}`); break; }
    case 'dormm': { const [tid, idx] = x.split('|'); const t = proj(tid); const m = t.members[+idx]; t.members.splice(+idx, 1); S.dlg = null; toast(m.pending ? '已撤销邀请' : `已移除${m.n}`); break; }
    case 'doleave': { const t = proj(x); D.team = D.team.filter((q) => q.id !== x); D.projects.unshift({ ...t, team: false, id: t.id, dir: t.name, papers: 12, notes: 6, runs: 3, created: '2026-09-15', u: 0 }); S.dlg = null; S.tsel = D.team[0] && D.team[0].id; toast(`已退出「${t.name}」，本机副本在我的项目里`); break; }
    case 'dodelcloud': S.dlg = null; toast('待做：服务端还没有删除云端项目的接口'); break;
    case 'resolve': d.left = d.left.filter((n) => n !== +x); if (!d.left.length) { const t = proj(d.arg); t.local = 'synced'; t.conflicts = 0; D.pending = D.pending.filter((p) => p.k !== 'conflict'); } break;
    case 'sendcode': d.sent = true; S.autofocus = 'd-code'; break;
    case 'dologin': S.logged = true; S.online = true; closeDlg(); toast('已登录'); break;
    case 'dologout': S.logged = false; S.dlg = null; toast('已退出登录，本机数据保留'); break;
    case 'dosync': { const p = proj(x); p.sync = 'on'; S.dlg = null; toast(`已开启「${p.name}」的多设备同步`); break; }
    case 'dounsync': { const p = proj(x); p.sync = undefined; S.dlg = null; toast(`已关闭「${p.name}」的多设备同步`); break; }
    case 'syncall': toast('正在同步全部团队项目…'); break;
    case 'syncone': toast(`正在同步「${proj(x).name}」…`); break;
    case 'clear-recents': { const old = D.recents; D.recents = []; toast('已清空最近记录', () => { D.recents = old; }); break; }
    case 'dismiss': D.pending = D.pending.filter((p) => p.id !== x); break;
    case 'sample': if (!D.projects.some((p) => p.id === 's1')) D.projects.unshift({ id: 's1', name: '示例：视觉 Token 剪枝', field: '示例项目', q: '用两篇论文和一个小实验，走一遍读文献、记笔记、跑实验', color: '#3f7a7a', opened: '刚刚', o: 0, u: 0, created: '2026-11-04', papers: 2, notes: 1, runs: 1, dir: '示例项目' }); S.dlg = null; toast('已打开示例项目'); break;
    case 'newnote': { const id = 'n' + Date.now(); D.inbox.unshift({ id, title: '无标题笔记', body: '', when: '刚刚' }); S.page = 'inbox'; S.itab = 'notes'; S.isel = id; S.cmd = null; break; }
    case 'newchat': { const id = 'c' + Date.now(); D.chats.unshift({ id, title: '新的问答', when: '刚刚', msgs: [['a', '有什么想问的？快速问答不读写文件。']] }); S.csel = id; break; }
    case 'delnote': { const n = D.inbox.find((q) => q.id === x); const at = D.inbox.indexOf(n); D.inbox = D.inbox.filter((q) => q.id !== x); S.isel = D.inbox[0] && D.inbox[0].id; toast(`已删除「${n.title}」`, () => { D.inbox.splice(at, 0, n); }); break; }
    case 'move': { const [nid, pid] = x.split('|'); const p = proj(pid); const isChat = nid.startsWith('c'); if (isChat) { D.chats = D.chats.filter((c) => c.id !== nid); S.csel = D.chats[0] && D.chats[0].id; } else { D.inbox = D.inbox.filter((n) => n.id !== nid); S.isel = D.inbox[0] && D.inbox[0].id; } toast(isChat ? `已移到「${p.name}」，之后用 Agent 回答，可以读这个项目的论文` : `已移到「${p.name}」的项目笔记`); break; }
    case 'cmd': S.cmd = { q: '', i: 0 }; S.autofocus = 'cmdq'; break;
    case 'cmdclose': S.cmd = null; break;
    case 'settings': toast(`打开设置窗口（${key(',')}）`); break;
    case 'theme': S.theme = x; toast('原型只演示浅色'); break;
    case 'pickdir': toast('打开系统的选择文件夹对话框'); break;
    case 'toast': toast(rest); break;
    case 'undo': if (S.toast && S.toast.undo) S.toast.undo(); S.toast = null; break;
    case 'demo-ctx': {
      S.page = 'mine'; S.view = 'grid'; S.filter = 'all'; render();
      const btn = $('#win .shelf .bk-m');
      if (btn) openMenu('project', btn.dataset.a.split(':')[2], btn);
      return;
    }
    default: break;
  }
  render();
}
function findAct(t) {
  for (let n = t; n && n !== document.body; n = n.parentElement) {
    if (n.dataset && n.dataset.a !== undefined) return n;
    if (n.dataset && n.dataset.stop) return null;
  }
  return null;
}
document.addEventListener('click', (e) => {
  const t = findAct(e.target);
  if (!t) {
    if ((S.menu && !e.target.closest('.menu')) || (S.mb && !e.target.closest('.mbar'))) { S.menu = null; S.mb = null; render(); }
    return;
  }
  if (t.disabled || t.classList.contains('dis')) return;
  e.preventDefault();
  act(t.dataset.a, t, e);
});
document.addEventListener('dblclick', (e) => {
  const r = e.target.closest('#win [data-dbl]');
  if (r) { openProject(r.dataset.dbl); render(); }
});
document.addEventListener('contextmenu', (e) => {
  const t = e.target.closest('#win [data-ctx]');
  if (!t) return;
  const p = proj(t.dataset.ctx);
  if (!p) return;
  e.preventDefault();
  if (p.team && S.page === 'team') S.tsel = p.id;
  openMenu(p.team ? 'team' : 'project', p.id, t, e);
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k) return;
  if (k.startsWith('dlg.')) S.dlg[k.slice(4)] = e.target.value;
  else if (k === 'cmdq') { S.cmd.q = e.target.value; S.cmd.i = 0; }
  else S[k] = e.target.value;
  render();
});
document.addEventListener('keydown', (e) => {
  const m = e.metaKey || e.ctrlKey;
  const k = e.key.toLowerCase();
  if (m && k === 'k') { e.preventDefault(); S.cmd = S.cmd ? null : { q: '', i: 0 }; S.autofocus = 'cmdq'; S.menu = null; render(); return; }
  if (e.key === 'Escape') { if (S.menu || S.mb) { S.menu = null; S.mb = null; } else if (S.cmd) S.cmd = null; else if (S.dlg) closeDlg(); render(); return; }
  if (S.cmd) {
    const n = (S.cmdFlat || []).length;
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && n) { e.preventDefault(); S.cmd.i = (Math.min(S.cmd.i, n - 1) + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; render(); }
    else if (e.key === 'Enter') { e.preventDefault(); const it = S.cmdFlat[Math.min(S.cmd.i, n - 1)]; S.cmd = null; if (it) act(it.a); else render(); }
    return;
  }
  if (S.dlg) return;
  if (m && /^[1-4]$/.test(e.key)) { e.preventDefault(); S.page = ['home', 'mine', 'team', 'inbox'][+e.key - 1]; render(); }
  else if (m && k === 'n') { e.preventDefault(); openDlg('new'); render(); }
  else if (m && k === 'o') { e.preventDefault(); openDlg('folder'); render(); }
});
window.addEventListener('resize', () => { fit(); placeMenu(); });

/* ---------- 启动 ---------- */
applyScen(Q.get('scen') || 'normal');
if (Q.get('filter')) S.filter = Q.get('filter');
if (Q.get('tsel')) S.tsel = Q.get('tsel');
if (Q.get('dlg')) { const [t, a] = Q.get('dlg').split(':'); openDlg(t, a); if (Q.get('step')) S.dlg.step = +Q.get('step'); if (Q.get('name')) S.dlg.name = Q.get('name'); }
if (Q.get('cmd') !== null) S.cmd = { q: Q.get('cmd') || '', i: 0 };
render();
if (Q.get('menu')) {
  const [ty, id] = Q.get('menu').split(':');
  const el = document.querySelector(`#win [data-a="menu:${ty}${id ? ':' + id : ''}"]`);
  if (el) openMenu(ty, id, el);
}
if (Q.get('mb')) { S.mb = Q.get('mb'); render(); }
</script>
