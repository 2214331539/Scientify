<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientify 产品功能结构图</title>
<!--
  Scientify 产品功能结构图。用浏览器直接打开，离线可用。
  功能内容在下方 id="source" 的文本里，每缩进两个空格是一层：
    名称 [已有|部分|待做] [P0|P1|P2] {相关文档路径} | 一句话说明
  状态只写在最末一层；上层的状态和统计自动汇总。
-->
<style>
:root{--ink:#1f2328;--ink2:#57606a;--muted:#6e7781;--line:#e5e7eb;--soft:#f6f8fa;--have:#1a7f37;--part:#bf8700;--todo:#8c959f;--font:"PingFang SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 var(--font);color:var(--ink);background:#fff;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;white-space:nowrap}
header .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.search{flex:0 1 360px;display:flex;align-items:center;gap:6px;border:1px solid #d0d7de;border-radius:8px;padding:0 6px 0 10px;height:32px;margin-left:auto;background:#fff}
.search:focus-within{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12)}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent}
.search .cnt{color:var(--muted);font-size:12px;white-space:nowrap}
.search button{border:0;background:transparent;color:var(--ink2);width:24px;height:24px;border-radius:5px}
.search button:hover{background:var(--soft)}
button{font:inherit;cursor:pointer}
.btn{height:30px;border:1px solid #d0d7de;background:#fff;border-radius:7px;padding:0 10px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.on{background:#eef1f4;border-color:#b6bec7;font-weight:600}
.btn.icon{width:30px;padding:0;justify-content:center;font-size:16px;line-height:1}
.zoom{display:flex;align-items:center;gap:4px}
.zoom .pct{min-width:46px;text-align:center;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:14px;padding:7px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fcfcfd}
.group{display:flex;align-items:center;gap:5px}
.group .lbl{color:var(--muted);font-size:12px;margin-right:2px}
.seg{display:inline-flex;border:1px solid #d0d7de;border-radius:7px;overflow:hidden}
.seg button{border:0;border-left:1px solid #d0d7de;background:#fff;height:28px;padding:0 10px;color:var(--ink2)}
.seg button:first-child{border-left:0}
.seg button.on{background:#eef1f4;color:var(--ink);font-weight:600}
.chip{height:26px;border:1px solid #d0d7de;background:#fff;border-radius:13px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;color:var(--ink2);white-space:nowrap}
.chip.on{border-color:#6e7781;color:var(--ink);font-weight:600;background:#f6f8fa}
.chip.off{opacity:.45}
.crumbs{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.crumbs a{color:var(--ink2);cursor:pointer;padding:2px 6px;border-radius:5px}
.crumbs a:hover{background:var(--soft);color:var(--ink)}
.crumbs a.cur{color:var(--ink);font-weight:600;cursor:default;background:transparent}
.crumbs .sep{color:#afb8c1}
.totals{margin-left:auto;color:var(--ink2);font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:-1px}
.dot.have{background:var(--have)}
.dot.part{border:1.5px solid var(--part);background:linear-gradient(90deg,var(--part) 50%,#fff 50%)}
.dot.todo{border:1.5px solid var(--todo);background:#fff}
main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
#stage{position:relative;overflow:hidden;cursor:grab;background:#fff;outline:none}
#stage.dragging{cursor:grabbing}
#stage svg{width:100%;height:100%;display:block;user-select:none}
.node{cursor:pointer}
.node.dim{opacity:.16}
.link{fill:none}
.link.dim{opacity:.1}
.node.enter{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0}}
.tog{cursor:pointer}
.tog:hover circle{fill:#f6f8fa}
aside{width:340px;border-left:1px solid var(--line);overflow:auto;background:#fff}
aside.hidden{display:none}
.panel{padding:16px 18px 24px}
.panel .path{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.panel .path a{cursor:pointer;color:var(--ink2);padding:1px 4px;border-radius:4px}
.panel .path a:hover{background:var(--soft)}
.panel h2{font-size:18px;margin:6px 0 8px;line-height:1.35;display:flex;align-items:center;gap:8px}
.panel h2 i{width:10px;height:10px;border-radius:3px;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;border:1px solid;white-space:nowrap}
.pill.have{color:var(--have);border-color:#a6dcb5;background:#f0faf3}
.pill.part{color:#9a6700;border-color:#eed48c;background:#fff8e5}
.pill.todo{color:#57606a;border-color:#d0d7de;background:#f6f8fa}
.pill.P0{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.pill.P1{color:#c2410c;border-color:#fed7aa;background:#fff7ed}
.pill.P2{color:#475569;border-color:#cbd5e1;background:#f8fafc}
.panel p.desc{margin:0 0 12px;font-size:13.5px;line-height:1.75}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef1f4;margin:6px 0 4px}
.sbar i{display:block;height:100%}
.slegend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.slegend span{display:inline-flex;align-items:center;gap:5px}
.panel h3{font-size:12.5px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.kids{list-style:none;margin:0;padding:0}
.kids li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.kids li:hover{background:var(--soft)}
.kids li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kids li .n{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.kids li .mini{width:46px;height:5px;border-radius:3px;overflow:hidden;display:flex;background:#eef1f4}
.kids li .mini i{display:block;height:100%}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.doc{font-size:12.5px;margin-top:14px;color:var(--ink2)}
.doc a{color:#0969da;text-decoration:none}
.doc a:hover{text-decoration:underline}
.tips{font-size:12px;color:var(--ink2);line-height:1.8;margin:6px 0 0;padding-left:16px}
.tips b{color:var(--ink)}
#mini{position:absolute;left:12px;bottom:12px;width:220px;height:140px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:crosshair}
.hint{position:absolute;right:12px;bottom:12px;color:var(--muted);font-size:11.5px;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.focusbadge{position:absolute;left:12px;top:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.05);display:none;align-items:center;gap:8px}
.focusbadge.show{display:flex}
.focusbadge b{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Scientify 产品功能结构图</h1>
  <span class="sub">产品 → 大模块 → 子模块 → 具体功能 · 2026-11-04</span>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜索功能，回车跳到下一个" autocomplete="off"><span class="cnt" id="qcount"></span><button type="button" id="qprev" title="上一个（Shift+回车）">↑</button><button type="button" id="qnext" title="下一个（回车）">↓</button></label>
  <div class="zoom"><button type="button" class="btn icon" id="zout" title="缩小（-）">−</button><span class="pct" id="pct">100%</span><button type="button" class="btn icon" id="zin" title="放大（+）">+</button><button type="button" class="btn" id="fit" title="适应窗口（0）">适应窗口</button><button type="button" class="btn" id="panelbtn" title="显示或隐藏右侧面板">面板</button></div>
</header>
<div class="bar">
  <div class="group"><span class="lbl">展开到</span><div class="seg" id="levels"><button type="button" data-level="1" class="on">大模块</button><button type="button" data-level="2">子模块</button><button type="button" data-level="3">功能</button><button type="button" data-level="99">全部</button></div></div>
  <div class="group" id="statusChips"><span class="lbl">现状</span><button type="button" class="chip on" data-status="have"><span class="dot have"></span>已有</button><button type="button" class="chip on" data-status="part"><span class="dot part"></span>部分</button><button type="button" class="chip on" data-status="todo"><span class="dot todo"></span>待做</button></div>
  <div class="group" id="priChips"><span class="lbl">优先级</span><button type="button" class="chip" data-pri="P0">P0</button><button type="button" class="chip" data-pri="P1">P1</button><button type="button" class="chip" data-pri="P2">P2</button></div>
  <div class="group"><button type="button" class="chip on" id="descToggle" title="在末级功能下显示一句话说明">显示说明</button><button type="button" class="chip on" id="spotToggle" title="选中节点时淡化其他分支">聚光</button></div>
  <div class="crumbs" id="crumbs"></div>
  <span class="totals" id="totals"></span>
</div>
<main>
  <div id="stage" tabindex="0">
    <svg id="map" aria-label="功能结构图"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg>
    <div class="focusbadge" id="focusbadge">正在聚焦 <b id="focusname"></b><button type="button" class="btn" id="focusup">返回上一层</button><button type="button" class="btn" id="focusall">回到全图</button></div>
    <canvas id="mini" title="小地图：点击或拖动移动视野"></canvas>
    <div class="hint">滚轮缩放 · 拖动平移 · 双击聚焦 · Esc 返回</div>
  </div>
  <aside id="aside"><div class="panel" id="panel"></div></aside>
</main>

<script type="text/plain" id="source">
Scientify | 本地优先、以项目为中心的科研工作台：把读过的文献、自己的判断、实验结果和论文正文连在一起，研究的依据和过程随时可追溯。
  项目中心 {页面/01-项目中心.md} | 启动后的第一个窗口：决定今天做哪项研究，管理项目、团队、收集箱和账号。
    侧栏 [已有] | 搜索入口、首页、我的项目、团队项目、收集箱、收藏的项目；左下角是账号、帮助、设置。
    首页 [P1] | 打开应用的第一页，只显示真实内容，没有欢迎横幅和统计卡片。
      最近项目 [已有] | 按最近打开排序的书本封面，个人和团队混排；右上角直达我的项目和团队项目。
      继续工作 [部分] | 跨项目列出最近编辑的笔记、运行和 AI 对话，点击回到这个对象；论文（含读到的页码）要新增跨窗口的最近打开记录。
      待处理 [部分] | 新加入的团队项目、同步冲突和同步失败、最近失败的运行，处理后消失；等待审批的 AI 操作还没接入。
      快速开始 [部分] | 没有项目时显示新建项目、登录并下载团队项目和数据位置；打开文件夹作为项目、示例项目待做。
    我的项目 | 个人项目：只在这台电脑上的和开启了多设备同步的，用书本封面展示。
      项目书架 [已有] | 书架和列表两种视图，封面颜色来自项目设置，书签角标表示收藏，云朵表示多设备同步。
      搜索项目 [已有] | 按项目名、研究问题和研究方向搜索。
      筛选 [已有] [P1] | 全部、收藏、多设备同步、已归档；已归档的项目默认隐藏。
      排序 [已有] [P1] | 最近打开、最近更新、名称、创建时间，记在本机。
      在其他设备上的项目 [已有] | 我开启了同步、还没下载到这台电脑的项目，半透明显示，点击下载并打开。
      项目菜单 | 右键或更多按钮打开。
        打开、编辑、收藏、归档 [已有] | 打开后回到这个项目上次停留的位置。
        删除 [已有] | 删除前说明哪些记录会删、哪些磁盘文件会保留。
        共享给团队 [已有] | 上传到协作服务并可以同时邀请成员，项目移到团队项目，ID 和本机文件夹不变。
        在多台设备上同步 [已有] | 开启前说明同步什么、不同步什么；已开启时菜单里是“立即同步”。
        在资源管理器或 Finder 中显示 [部分] | 现在显示文献文件夹，代码目录还不能显示。
      新建项目 [已有] | 两步向导：名称、研究问题、研究方向、封面颜色；文献文件夹、代码目录和多设备同步。
      打开文件夹作为项目 [待做] | 把已有的研究目录直接变成一个项目。
    团队项目 [P0] | 和别人共享的项目和成员：项目表格加右侧详情，没有宣传卡片和标语。
      团队项目表格 [已有] | 项目名、最近更新、我的角色、成员、本机状态（已同步、有冲突、同步失败、未下载、离线）；更新人要等服务端返回。
      新建团队项目 [已有] | 在服务器上创建一个云端项目。
      共享本机项目 [已有] | 把个人项目共享给团队，项目 ID 不变，原文件夹继续使用。
      下载并打开 [已有] | 另一台设备第一次进入时取回整个项目。
      成员详情 [已有] | 成员、角色和加入时间；所有者邀请、改角色、移除、撤销邀请，成员可以退出项目。
      删除云端项目 [待做] | 所有者删除云端项目；服务端还没有接口。
      团队切换 [待做] [P2] | 一个账号加入多个团队，在这里切换。
      未登录状态 [已有] | 一句话说明和“登录”按钮，不放宣传文案。
    收集箱 [P0] | 还没归到任何项目的随手笔记和 AI 对话。
      随手笔记 [已有] | 在项目中心打开速记时记到这里。
      收集箱的 AI 对话 [已有] | 不属于任何项目，也是 Agent，在数据目录下的收集箱文件夹里工作；划词翻译转来的对话不在项目里时也放这里。
      侧栏入口 [已有] [P0] | 项目中心侧栏里的“收集箱”：随手笔记和 AI 对话两个列表，笔记在右侧面板编辑。
      移到项目 [待做] | 把笔记或对话移进某个项目。
    账号入口 | 项目中心左下角。
      登录按钮 [已有] | 未登录时显示“登录”，打开登录窗口。
      账号菜单 [已有] | 登录后显示部分隐藏的手机号和连接状态，菜单里是团队项目、同步与协作设置、外观、退出登录。
      账号资料与设备 [待做] | 昵称、头像、已登录的设备列表。
  项目窗口框架 {02-信息架构与页面结构.md} | 所有模块共用的外壳：顶栏、模块栏、侧栏、主区、右侧栏、状态栏。
    顶栏 | 品牌、项目切换、搜索、亮暗切换。
      返回项目中心 [已有] | 有未保存的内容或后台任务时先提示。
      项目切换器 [已有] | 原地切换项目，不新开窗口；团队项目带“团队”标记。
      搜索框 [已有] [P0] | 点击打开搜索，显示快捷键；命令模式待做。
      同步状态 [待做] [P0] | 已同步、同步中、离线、有冲突、同步失败；点开看同步面板。
      共享按钮 [待做] | 打开当前项目的成员与共享。
      通知按钮 [待做] [P1] | 显示未读数，点开通知中心。
      AI 助手开关 [已有] | 现在在状态栏右下角，计划移到顶栏。
    模块栏 [已有] | 概览、文献、笔记、实验、写作五个一级入口，不再为终端、AI、知识图谱单独开入口。
    侧栏 [已有] | 当前模块的范围：分组、文件夹、标签、实验列表；可以调宽和收起。
    主区与标签页 [已有] | 打开的论文、笔记、运行、稿件各占一个标签页，切换模块时保留。
    右侧栏 | 跨模块的工具，窗口窄于 900 时浮在主区上方。
      AI 助手面板 [已有] | 见“AI 助手”模块。
      速记面板 [已有] | 见“笔记 → 速记”。
      详情面板 [待做] [P1] | 显示当前选中的论文、笔记、运行的属性和关联，代替各页自己塞的信息区。
    状态栏 [部分] | 保存状态、同步状态、Git 分支、Python 解释器、后台任务数、通知数。
    保留现场 [已有] | 切换页面、项目、主题、语言时保留草稿、选区、撤销历史、滚动和阅读位置。
  概览 {页面/02-概览.md} | 项目主页：研究问题、做到哪了、下一步、最近发生了什么；现在是占位页。
    研究问题 [待做] [P1] | 项目要回答的问题，直接在这里编辑。
    进展与里程碑 [待做] [P1] | 手动添加阶段，标记完成，当前阶段高亮。
    下一步 [待做] [P1] | 项目待办，可以从笔记和 AI 回答添加。
    最近活动 [待做] [P1] | 运行、笔记、摘录、成员修改的时间线，只记真实发生的事。
    核心文献 [待做] | 几篇关键论文，点击进入论文阅读。
    实验动态 [待做] | 运行中、刚完成、失败的运行，点击进入运行记录。
    最近笔记 [待做] | 最近编辑的笔记，点击进入笔记。
    AI 项目摘要 [待做] [P2] | 按需生成项目现状摘要，列出依据。
    项目设置 | 现在只有“编辑项目”表单。
      基本信息 [已有] | 名称、研究问题、研究方向、封面颜色。
      关联文件夹 [部分] | 文献文件夹现在在文献页单独关联，目标是在这里统一管理。
      成员与共享入口 [待做] | 打开成员与共享。
      归档与删除 [已有] | 删除前说明后果。
  文献 {页面/03-文献.md} | 管理和阅读项目的论文；PDF 和论文笔记留在用户自己的文件夹，Scientify 只记录位置和阅读信息。
    文献库 | 侧栏选范围，主区是列表，右侧是详情。

  }
  function barHtml(c, cls = 'sbar') {
    return '<div class="' + cls + '">' + ['have', 'part', 'todo'].map((k) => (c[k] ? '<i style="width:' + (100 * c[k]) / c.total + '%;background:' + STATUS_COLOR[k] + '"></i>' : '')).join('') + '</div>';
  }
  function countText(c) { return '已有 ' + c.have + ' · 部分 ' + c.part + ' · 待做 ' + c.todo; }
  function childList(n) {
    return '<ul class="kids">' + n.children.map((c) => '<li data-sel="' + c.id + '"><span class="dot ' + c.status + '"></span><span class="nm">' + esc(c.label) + '</span>' + (c.pri ? '<span class="pill ' + c.pri + '">' + c.pri + '</span>' : '') + '<span class="n">' + (c.children.length ? c.count.total + ' 项' + barHtml(c.count, 'mini') : STATUS_NAME[c.status]) + '</span></li>').join('') + '</ul>';
  }
  function renderPanel() {
    const n = state.selected;
    const panel = $('panel');
    if (!n) {
      const c = ROOT.count;
      panel.innerHTML = '<div class="path">产品功能结构</div><h2>Scientify</h2><p class="desc">' + esc(ROOT.desc) + '</p>' +
        '<h3>整体完成度 · 共 ' + c.total + ' 项具体功能</h3>' + barHtml(c) + '<div class="slegend"><span><span class="dot have"></span>已有 ' + c.have + '</span><span><span class="dot part"></span>部分 ' + c.part + '</span><span><span class="dot todo"></span>待做 ' + c.todo + '</span></div>' +
        '<h3>' + ROOT.children.length + ' 个大模块（点击查看）</h3>' + childList(ROOT) +
        '<h3>怎么看</h3><ul class="tips"><li><b>缩放</b>：滚轮或触控板双指；<b>平移</b>：按住拖动。</li><li><b>聚焦</b>：双击一个模块，只看这一支；顶部面包屑或 Esc 返回。</li><li><b>展开</b>：点节点旁的圆圈；或用上方“展开到”。</li><li><b>聚光</b>：选中节点后，其他分支变淡。</li><li><b>筛选</b>：只看某种现状或某个优先级，其余变淡。</li><li><b>键盘</b>：方向键移动选中，空格展开或收起，F 聚焦，+ / − 缩放，0 适应窗口。</li></ul>' +
        '<h3>图例</h3><ul class="tips"><li><span class="dot have"></span> 已有：已经实现</li><li><span class="dot part"></span> 部分：已实现但有明显缺口</li><li><span class="dot todo"></span> 待做：还没做或是占位页</li><li><span class="pill P0">P0</span> 让已有功能可靠、讲清楚；<span class="pill P1">P1</span> 补齐主线页面；<span class="pill P2">P2</span> 进阶能力（见《完善路线》）</li></ul>';
      return;
    }
    const chain = ancestors(n).reverse();
    const path = chain.map((p) => '<a data-sel="' + p.id + '">' + esc(p === ROOT ? 'Scientify' : p.label) + '</a>').join('<span>›</span>');
    const doc = docOf(n);
    let html = '<div class="path">' + (path || '产品') + '</div><h2><i style="background:' + (n.depth === 0 ? '#1f2328' : n.color) + '"></i>' + esc(n.label) + '</h2>' +
      '<div class="pills"><span class="pill ' + n.status + '">' + STATUS_NAME[n.status] + '</span>' + (n.pri ? '<span class="pill ' + n.pri + '">' + n.pri + '</span>' : '') + '</div>' +
      (n.desc ? '<p class="desc">' + esc(n.desc) + '</p>' : '');
    if (n.children.length) {
      html += '<h3>下含 ' + n.children.length + ' 项 · 共 ' + n.count.total + ' 项具体功能</h3>' + barHtml(n.count) + '<div class="slegend"><span><span class="dot have"></span>已有 ' + n.count.have + '</span><span><span class="dot part"></span>部分 ' + n.count.part + '</span><span><span class="dot todo"></span>待做 ' + n.count.todo + '</span></div>' + childList(n);
      html += '<div class="actions"><button type="button" class="btn" data-act="focus">聚焦这一支</button><button type="button" class="btn" data-act="expandAll">全部展开</button><button type="button" class="btn" data-act="collapse">收起</button></div>';
    } else {
      html += '<div class="actions"><button type="button" class="btn" data-act="up">看所在分组</button></div>';
    }
    if (doc) html += '<div class="doc">详细设计：<a href="' + esc(encodeURI(doc.doc)) + '" target="_blank" rel="noopener">' + esc(doc.doc.replace(/^.*\//, '')) + '</a></div>';
    panel.innerHTML = html;
  }
  $('panel').addEventListener('click', (e) => {
    const sel = e.target.closest('[data-sel]');
    if (sel) { select(all[Number(sel.dataset.sel)], true); return; }
    const act = e.target.closest('[data-act]');
    if (!act || !state.selected) return;
    const n = state.selected;
    if (act.dataset.act === 'focus') focus(n);
    if (act.dataset.act === 'expandAll') { expandBranch(n, true); setTimeout(() => fit(visible.filter((x) => inside(x, n))), 30); }
    if (act.dataset.act === 'collapse') expandBranch(n, false);
    if (act.dataset.act === 'up' && n.parent) select(n.parent, true);
  });
  $('crumbs').addEventListener('click', (e) => {
    const a = e.target.closest('[data-focus]');
    if (a) focus(all[Number(a.dataset.focus)]);
  });
  $('focusup').addEventListener('click', () => focus(state.focus.parent || ROOT));
  $('focusall').addEventListener('click', () => focus(ROOT));

  /* ---------- toolbar ---------- */
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    expandTo(Number(b.dataset.level));
    render(false);
    setTimeout(() => fit(), 10);
  });
  $('statusChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    const k = b.dataset.status;
    const on = Object.values(state.status).filter(Boolean).length;
    if (state.status[k] && on === 1) return;
    state.status[k] = !state.status[k];
    b.classList.toggle('on', state.status[k]);
    b.classList.toggle('off', !state.status[k]);
    applyDim();
  });
  $('priChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pri]');
    if (!b) return;
    const p = b.dataset.pri;
    if (state.pri.has(p)) state.pri.delete(p); else state.pri.add(p);
    b.classList.toggle('on', state.pri.has(p));
    applyDim();
  });
  $('descToggle').addEventListener('click', (e) => {
    state.showDesc = !state.showDesc;
    e.currentTarget.classList.toggle('on', state.showDesc);
    render(false);
  });
  $('spotToggle').addEventListener('click', (e) => {
    state.spotlight = !state.spotlight;
    e.currentTarget.classList.toggle('on', state.spotlight);
    applyDim();
  });
  const centerPoint = () => [stage.clientWidth / 2, stage.clientHeight / 2];
  $('zin').addEventListener('click', () => zoomAt(...centerPoint(), 1.25));
  $('zout').addEventListener('click', () => zoomAt(...centerPoint(), 0.8));
  $('fit').addEventListener('click', () => fit());
  $('panelbtn').addEventListener('click', () => { $('aside').classList.toggle('hidden'); setTimeout(drawMini, 20); });

  /* ---------- search ---------- */
  function runSearch(q) {
    state.query = q.trim().toLowerCase();
    state.matches = state.query ? all.filter((n) => n.label.toLowerCase().includes(state.query) || n.desc.toLowerCase().includes(state.query)) : [];
    state.matchSet = new Set(state.matches.map((n) => n.id));
    state.matchIndex = -1;
    $('qcount').textContent = state.query ? (state.matches.length ? state.matches.length + ' 项' : '无结果') : '';
    if (state.matches.length && state.matches.length <= 80) {
      if (state.matches.some((n) => !inside(n, state.focus))) state.focus = ROOT;
      state.matches.forEach(openPath);
    }
    render();
  }
  function step(dir) {
    if (!state.matches.length) return;
    state.matchIndex = (state.matchIndex + dir + state.matches.length) % state.matches.length;
    const n = state.matches[state.matchIndex];
    $('qcount').textContent = state.matchIndex + 1 + ' / ' + state.matches.length;
    select(n, true);
  }
  let timer = 0;
  $('q').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => runSearch(e.target.value), 160); });
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); if (state.query !== e.target.value.trim().toLowerCase()) runSearch(e.target.value); step(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') { e.target.value = ''; runSearch(''); stage.focus(); }
  });
  $('qnext').addEventListener('click', () => step(1));
  $('qprev').addEventListener('click', () => step(-1));

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const n = state.selected;
    const [cx, cy] = centerPoint();
    if (e.key === '+' || e.key === '=') zoomAt(cx, cy, 1.2);
    else if (e.key === '-' || e.key === '_') zoomAt(cx, cy, 1 / 1.2);
    else if (e.key === '0') fit();
    else if (e.key === 'f' || e.key === 'F') { if (n && n.children.length) focus(n); }
    else if (e.key === '/' ) { e.preventDefault(); $('q').focus(); }
    else if (e.key === 'Escape') { if (state.focus !== ROOT) focus(state.focus.parent || ROOT); else select(null); }
    else if (e.key === ' ' || e.key === 'Enter') { if (n && n.children.length) { e.preventDefault(); toggle(n); } }
    else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      if (!n) { select(state.focus, true); return; }
      const sib = n.parent ? n.parent.children : [n];
      const i = sib.indexOf(n);
      const outward = (n.side || 1) > 0 ? 'ArrowRight' : 'ArrowLeft';
      const inward = outward === 'ArrowRight' ? 'ArrowLeft' : 'ArrowRight';
      if (e.key === 'ArrowDown' && i < sib.length - 1) select(sib[i + 1], true);
      else if (e.key === 'ArrowUp' && i > 0) select(sib[i - 1], true);
      else if (e.key === outward && n.children.length) { expanded.add(n.id); select(n === ROOT ? n.children.find((c) => c.side0 === (e.key === 'ArrowRight' ? 1 : -1)) : n.children[0], true); }
      else if (e.key === inward && n.parent) select(n.parent, true);
      else if (n === ROOT && e.key === 'ArrowLeft') select(n.children.find((c) => c.side0 === -1), true);
    }
  });

  /* ---------- minimap ---------- */
  const mini = $('mini');
  const mc = mini.getContext('2d');
  let miniMap = null;
  function drawMini() {
    if (!visible.length) return;
    const dpr = window.devicePixelRatio || 1;
    const W = mini.clientWidth;
    const H = mini.clientHeight;
    if (mini.width !== W * dpr) { mini.width = W * dpr; mini.height = H * dpr; }
    mc.setTransform(dpr, 0, 0, dpr, 0, 0);
    mc.clearRect(0, 0, W, H);
    const b = bounds(visible);
    const s = Math.min((W - 12) / (b.x1 - b.x0), (H - 12) / (b.y1 - b.y0));
    const ox = (W - (b.x1 - b.x0) * s) / 2 - b.x0 * s;
    const oy = (H - (b.y1 - b.y0) * s) / 2 - b.y0 * s;
    miniMap = { s, ox, oy };
    for (const n of visible) {
      mc.fillStyle = n.depth === 0 ? '#1f2328' : n.depth === 1 ? n.color : mix(n.color, 0.45);
      mc.fillRect(ox + n.tx * s, oy + n.ty * s, Math.max(1.5, n.m.w * s), Math.max(1.5, n.m.h * s));
    }
    const vx = (-view.x / view.k) * s + ox;
    const vy = (-view.y / view.k) * s + oy;
    const vw = (stage.clientWidth / view.k) * s;
    const vh = (stage.clientHeight / view.k) * s;
    mc.strokeStyle = '#d4a72c';
    mc.lineWidth = 1.6;
    mc.strokeRect(vx, vy, vw, vh);
  }
  function miniJump(e) {
    if (!miniMap) return;
    const r = mini.getBoundingClientRect();
    const wx = (e.clientX - r.left - miniMap.ox) / miniMap.s;
    const wy = (e.clientY - r.top - miniMap.oy) / miniMap.s;
    view.x = stage.clientWidth / 2 - wx * view.k;
    view.y = stage.clientHeight / 2 - wy * view.k;
    applyView();
  }
  let miniDrag = false;
  mini.addEventListener('pointerdown', (e) => { miniDrag = true; mini.setPointerCapture(e.pointerId); miniJump(e); e.stopPropagation(); });
  mini.addEventListener('pointermove', (e) => { if (miniDrag) miniJump(e); });
  mini.addEventListener('pointerup', () => { miniDrag = false; });

  /* ---------- start ---------- */
  const t = ROOT.count;
  $('totals').innerHTML = ROOT.children.length + ' 个大模块 · ' + t.total + ' 项具体功能 · <span class="dot have"></span> ' + t.have + ' <span class="dot part"></span> ' + t.part + ' <span class="dot todo"></span> ' + t.todo;
  expandTo(1);
  const wanted = decodeURIComponent(location.hash.slice(1));
  const target = wanted && all.find((n) => n.path === wanted);
  render(false);
  if (target) { select(target); setTimeout(() => centerOn(target, 1), 30); }
  else fit(visible, 44, false);
  window.addEventListener('resize', () => drawMini());
  stage.focus();
})();
</script>
</body>
</html>
